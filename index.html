<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0e">
<title>Beat Rarity</title>
<style>
:root{
  --bg:#0c0c0e; --panel:#141417; --panel2:#1a1a1e; --line:#25252b; --line2:#33333b;
  --text:#ecebe8; --muted:#8b8b94; --dim:#5d5d66;
  --acc:#ff7a1a; --acc-hi:#ffa25c; --acc-lo:#5a3416; --acc-bg:#1e1610; --bad:#e5484d;
  --t-dead:#3a2a24; --t-bside:#5f5f68; --t-white:#d9d6cf; --t-promo:#f0c08a; --t-test:#ff7a1a; --t-grail:#ffd23f;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--muted)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 72px}
.lbl{font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font:700 13px/1 var(--mono);letter-spacing:.22em}
.brand b{color:var(--acc)}
.meta{font:500 11px/1.45 var(--mono);letter-spacing:.1em;color:var(--muted);text-align:right;text-transform:uppercase}
.meta .pr{color:var(--acc)}
.screen{animation:in .16s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
h1{font:600 30px/1.1 var(--sans);letter-spacing:-.015em;margin:8px 0 8px}
h2{font:600 22px/1.2 var(--sans);letter-spacing:-.01em;margin:4px 0}
.sub{color:var(--muted);margin:0 0 16px;max-width:600px}
.fine{color:var(--dim);font-size:13px;margin:10px 0 0}

.btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#4a4a54}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.go{background:var(--acc);border-color:var(--acc);color:#160900}
.btn.go:hover:not(:disabled){background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.big{width:100%;height:54px;font-size:13px}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.go.on{background:var(--panel2);color:var(--acc)}

/* start */
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
.specs div{background:var(--panel);padding:12px 14px;min-width:0}
.specs b{display:block;font:600 14px/1.25 var(--mono);margin-top:6px}
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px}
.rounds div{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.rounds b{display:block;font:600 15px/1.2 var(--sans);margin:6px 0 2px}
.rounds span.n{font:600 11px/1 var(--mono);color:var(--muted)}
.rounds .drop{border-color:var(--acc-lo);background:var(--acc-bg)}
.x2{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.08em;color:#160900;background:var(--acc);border-radius:4px;padding:3px 5px;margin-left:6px;vertical-align:2px}
.how{color:var(--muted);font-size:14px;margin:0 0 20px}
.how em{color:var(--text);font-style:normal}
.played{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--acc-lo);background:var(--acc-bg);border-radius:10px;margin-bottom:12px}
.played b{display:block;font:600 16px/1.3 var(--mono);margin-top:4px;color:var(--acc)}
.streak{font:700 11px/1 var(--mono);letter-spacing:.1em;color:var(--acc)}
.twist{display:inline-block;margin-left:8px;font:700 10px/1 var(--mono);letter-spacing:.12em;padding:4px 7px;border-radius:4px;border:1px solid var(--t-grail);color:var(--t-grail);vertical-align:6px;text-transform:uppercase}
.links{display:flex;justify-content:center;gap:18px;margin-top:16px;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}

/* round */
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.prog div{border-top:2px solid var(--line2);padding-top:8px;font:600 10px/1 var(--mono);letter-spacing:.12em;color:var(--dim);white-space:nowrap;overflow:hidden}
.prog .done{border-color:var(--acc-lo);color:var(--muted)}
.prog .cur{border-color:var(--acc);color:var(--text)}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.timer{font:700 28px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer.low{color:var(--acc)}
.ov{display:grid;grid-template-columns:44px repeat(16,1fr);gap:3px 2px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#101013;margin-bottom:14px}
.ov .ol{font:600 9px/10px var(--mono);letter-spacing:.1em;color:var(--dim)}
.ov .ol.cur{color:var(--acc)}
.ov .m{height:10px;border-radius:2px;background:#1b1b20}
.ov .m.on{background:#6a6a74}
.ov .m.on.cur{background:var(--acc)}
.ov .m.ph{outline:1px solid #ffffff60}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font:600 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim)}
.chip.ok{border-color:var(--acc);color:var(--text)}
.chip.ok i{background:var(--acc);border-color:var(--acc)}
.chip.blind{border-color:var(--t-grail);color:var(--t-grail)}
.budget{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font:600 12px/1 var(--mono);letter-spacing:.08em}
.budget .segs{display:flex;gap:3px}
.budget .segs i{width:7px;height:14px;border-radius:2px;background:var(--acc)}
.budget .segs i.used{background:#2a2a30}
.budget.spent{border-color:var(--acc-lo);color:var(--acc)}
.ed{display:grid;grid-template-columns:52px repeat(var(--cols),1fr);gap:4px}
.ed + .ed{margin-top:14px}
.rl{font:600 10px/1 var(--mono);letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;white-space:nowrap}
.rl.root{color:var(--acc-hi)}
.c{position:relative;height:var(--ch,34px);min-width:0;border-radius:5px;background:#1c1c21;border:1px solid #2a2a31;transition:background .05s}
.c.alt{background:#232329}
.c.on{background:var(--acc);border-color:var(--acc-hi)}
.c.on.g::before{content:"";position:absolute;left:3px;top:3px;width:0;height:0;border-left:7px solid #160900;border-bottom:7px solid transparent}
.c.ph{border-color:#ffffff70}
.c.ph:not(.on){background:#2e2e35}
.c.on.ph{background:var(--acc-hi)}
.c.spent{opacity:.3;cursor:not-allowed}
.c.ctx:not(.on){box-shadow:inset 0 -3px 0 #55555f}
.sn{font:600 9px/1 var(--mono);color:var(--dim);text-align:center;padding-top:2px}
.toolbar{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.toolbar .go{margin-left:auto}

/* weigh-in */
.dialwrap{position:relative;max-width:420px;margin:0 auto}
.dial{width:100%;display:block}
#needle{transform-box:view-box;transform-origin:160px 170px;transition:transform .42s cubic-bezier(.3,1.35,.5,1)}
.readout{text-align:center;margin-top:-4px}
.readout .w{font:700 56px/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.readout .u{font:600 11px/1 var(--mono);letter-spacing:.16em;color:var(--muted)}
.badge2{position:absolute;right:6px;top:4px;font:800 18px/1 var(--mono);color:#160900;background:var(--acc);padding:6px 9px;border-radius:6px;opacity:0}
.badge2.flash{animation:flash .3s steps(1,end) 4;opacity:1}
@keyframes flash{50%{opacity:.1}}
.wrows{margin-top:18px}
.wrow{display:grid;grid-template-columns:90px 1fr 70px;gap:8px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);opacity:.35;transition:opacity .2s}
.wrow.live,.wrow.done{opacity:1}
.wrow .wn{font:600 11px/1.3 var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding-top:5px}
.wrow.live .wn{color:var(--acc)}
.wrow .wt{font:700 18px/1 var(--mono);text-align:right;padding-top:4px}
.wrow .wt small{display:block;font:600 10px/1.3 var(--mono);color:var(--dim);margin-top:3px}
.stamps{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.ns{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 7px;border-radius:4px;font:600 11px/1 var(--mono);border:1px solid;animation:drop .22s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(1.15)}to{opacity:1;transform:none}}
.ns.dead{color:#8a6f66;border-color:#3a2a24;text-decoration:line-through}
.ns.bside{color:#9a9aa3;border-color:#3a3a42}
.ns.white{color:var(--t-white);border-color:#77746e}
.ns.promo{color:var(--t-promo);border-color:#8a6a48}
.ns.test{color:var(--t-test);border-color:var(--t-test)}
.ns.grail{color:#160900;background:var(--t-grail);border-color:var(--t-grail)}
.wnote{grid-column:2/4;font-size:12px;color:var(--acc-hi)}
.wnote.bad{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;font:600 10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.final{margin-top:26px;display:none}
.final.show{display:block;animation:in .2s ease-out}
.tierstamp{display:inline-block;font:800 26px/1 var(--sans);padding:10px 16px;border:2px solid var(--acc);color:var(--acc);border-radius:8px;transform:rotate(-2deg);animation:stamp .18s ease-out}
.tierstamp.grail{border-color:var(--t-grail);color:var(--t-grail)}
@keyframes stamp{from{transform:rotate(-2deg) scale(1.35);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
.heavier{font:600 16px/1.4 var(--sans);margin:14px 0 4px}
.heavier b{font-family:var(--mono);color:var(--acc)}
.sec{margin-top:26px}
.sec>.lbl{display:block;margin-bottom:10px}
.grails{display:grid;gap:8px}
.gbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);text-align:left}
.gbtn .gl{font-size:14px}
.gbtn .gl small{display:block;font:600 10px/1.4 var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.gbtn .gs{font:700 11px/1 var(--mono);letter-spacing:.1em;color:var(--t-grail);white-space:nowrap}
.gbtn.on{border-color:var(--t-grail);background:#1c1a10}
.gbtn.found{opacity:.75;cursor:default}
.skip{display:block;margin:12px auto 0;font:600 11px/1 var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;padding:8px}
.sharewrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.card{width:100%;max-width:370px;background:linear-gradient(180deg,#18181c,#0f0f12);border:1px solid var(--line2);border-radius:16px;padding:22px 22px 18px}
.card .ch{display:flex;justify-content:space-between;font:700 11px/1 var(--mono);letter-spacing:.2em}
.card .ch b{color:var(--acc)}
.card .ct{display:inline-block;font:700 14px/1 var(--mono);letter-spacing:.08em;margin-top:24px;padding:7px 10px;border:1.5px solid var(--acc);color:var(--acc);border-radius:6px;text-transform:uppercase}
.card .ct.grail{border-color:var(--t-grail);color:var(--t-grail)}
.card .cd{font:700 54px/1 var(--mono);margin-top:12px;letter-spacing:-.04em}
.card .cd small{font-size:12px;color:var(--muted);letter-spacing:.14em;margin-left:8px}
.card .grid{margin-top:18px;display:grid;grid-template-columns:34px repeat(16,1fr);gap:3px 2px;align-items:center}
.card .grid span{font:600 9px/1 var(--mono);letter-spacing:.08em;color:var(--muted)}
.card .grid i{height:12px;border-radius:2px;background:#1e1e23}
.card .cf{display:flex;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--muted)}
.card .cf b{color:var(--text)}
i.dead{background:var(--t-dead)!important} i.bside{background:var(--t-bside)!important} i.white{background:var(--t-white)!important}
i.promo{background:var(--t-promo)!important} i.test{background:var(--t-test)!important} i.grail{background:var(--t-grail)!important}
.shareact{display:grid;gap:8px;min-width:190px}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;height:200px;margin:12px 0 8px;background:#09090b;color:#cfd3c8;border:1px solid var(--line);border-radius:8px;font:12px/1.4 var(--mono);padding:10px;resize:vertical}
.arch{display:grid;gap:8px}
.arch button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left}
.arch b{font:600 16px/1.2 var(--sans)}
.arch span{font:600 11px/1.3 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
@media (max-width:560px){
  h1{font-size:26px}
  .specs b{font-size:12px}
  .rounds{grid-template-columns:repeat(2,1fr)}
  .ed{grid-template-columns:38px repeat(var(--cols),1fr)}
  .rl{font-size:9px}
  .ov{grid-template-columns:32px repeat(16,1fr);padding:8px}
  .toolbar .go{flex:1 1 100%;margin-left:0;height:52px}
  .wrow{grid-template-columns:62px 1fr 54px}
  .readout .w{font-size:48px}
  .card{max-width:none}
  .shareact{width:100%}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- ============================================================
     CORE — pure data + logic. No DOM, no audio. Tune here.
     ============================================================ -->
<script id="core">
const CONFIG = {
  STEPS: 16,
  ROUND_SECONDS: 45,
  SEED_PLAYERS: 100,            // seed counts are "pretend players" out of this many
  SEED_FADE_SUBMISSIONS: 200,   // seed weight = max(0, 1 - real submissions / this)
  // The rarity ladder: a note's tier comes from the share of players with a note in that exact cell.
  LADDER: [                     // checked top-down: share > above → that tier
    { id: "bside", name: "B-side",      above: 0.30, w: 0.5 },
    { id: "white", name: "White label", above: 0.15, w: 2.0 },
    { id: "promo", name: "Promo",       above: 0.05, w: 4.0 },
    { id: "test",  name: "Test press",  above: 0,    w: 7.0 }   // also any non-Grail note under 1%
  ],
  GRAIL: { id: "grail", name: "Grail", below: 0.01, w: 12.0 },  // only the lane's flagged Grail cell
  DEAD:  { id: "dead",  name: "Dead wax", w: 0 },                // a cell nobody in today's crate used
  DROP_MULTIPLIER: 2,           // round 4 counts double
  MUD_CAP: 0.5,                 // a lane with a hard clash keeps this fraction of its weight
  CRATE_TIERS: [ [0, "B-side"], [22, "White label"], [34, "Promo"], [55, "Test press"], [100, "Grail"] ],  // crowd median ≈ 21, p90 ≈ 34
  SCALE_MAX: 130,               // crate weight at full needle swing
  CROWD_SAMPLE: 400,            // pretend crates for "heavier than X%"
  REVEAL: { LANE_MS: 320, NOTE_MS: 250, SUB_MS: 560, SURGE_MS: 1300, FINAL_MS: 700 },
  LAUNCH_DATE: "2026-11-18",    // puzzle No. 1 (UTC)
  LOOKAHEAD_S: 0.12,
  SCHEDULE_MS: 25
};

const NOTES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
const SCALES = {
  minPent:  { label: "minor pentatonic", iv: [0, 3, 5, 7, 10] },
  majPent:  { label: "major pentatonic", iv: [0, 2, 4, 7, 9] },
  aeolian:  { label: "minor",            iv: [0, 2, 3, 5, 7, 8, 10] },
  dorian:   { label: "dorian",           iv: [0, 2, 3, 5, 7, 9, 10] },
  phrygian: { label: "phrygian",         iv: [0, 1, 3, 5, 7, 8, 10] },
  harmMin:  { label: "harmonic minor",   iv: [0, 2, 3, 5, 7, 8, 11] },
  major:    { label: "major",            iv: [0, 2, 4, 5, 7, 9, 11] },
  minBlues: { label: "minor blues",      iv: [0, 3, 5, 6, 7, 10] }
};
const LANES = [
  { id: "drums", round: 1, kind: "drum",   name: "Drums",    short: "DR",  budget: 12, mono: false, rows: ["Kick", "Snare", "Hat"], mult: 1 },
  { id: "bass",  round: 2, kind: "bass",   name: "808",      short: "808", budget: 6,  mono: true,  pitched: true, mult: 1 },
  { id: "mel",   round: 3, kind: "melody", name: "Melody",   short: "MEL", budget: 8,  mono: true,  pitched: true, mult: 1 },
  { id: "fx",    round: 4, kind: "fx",     name: "The Drop", short: "FX",  budget: 3,  mono: true,  rows: ["Riser", "Impact", "Chop"], mult: CONFIG.DROP_MULTIPLIER }
];

/* ------------------------------------------------------------
   PUZZLES — hand-authored. Seed format per lane:
     drums:    [players, kick, snare, hat]    16-char strings, x = hit
     bass/mel: [players, "0......0..3....."]  digit = pitch row (0 = root, counting up the scale)
     fx:       [players, "i.......c...r..."]  r = riser, i = impact, c = vocal chop
   rares: single odd notes a few players added ("step:row": players)
   grail: the lane's rarest valid note (tests check it is the lowest-share token)
   kit:   kick [startHz, endHz, decay, click] · snare [Hz, decay, toneHz, clap?] · hat [Hz, decay]
          bass [decay, drive] · mel [voice, decay] · fx [riser type, chop vowel]
   ------------------------------------------------------------ */
const PUZZLES = [
  { id: "night-shift", name: "Night Shift", style: "Trap", bpm: 140, root: 0, scale: "minPent",
    prompt: "Hard 808s, fast hats. Find the pocket nobody else is sitting in.",
    kit: { kick: [180, 42, 0.5, 0.3], snare: [2200, 0.16, 200, 1], hat: [9000, 0.035], bass: [0.9, 2.5], mel: ["bell", 0.6], fx: ["noise", "a"] },
    seed: {
      drums: [[38, "x......x..x.....", "....x.......x...", "x.x.x.x.x.x.x..."], [20, "x.....x...x.....", "....x.......x...", "x.x.x.xxx.x....."],
              [16, "x..x......x.....", "....x.......x...", "..x...x...x...x."], [14, "x.......x.x.....", "....x.......x..x", "x...x...x...x..."],
              [12, "xx.....x........", "....x.......x...", "x.x.x.x.x.x.x..."]],
      bass: [[40, "0......0..0....."], [22, "0.....0...3....."], [16, "0......0..4...3."], [12, "0..0......2....."], [10, "0.......5.....4."]],
      mel:  [[34, "4...3...2...0..."], [22, "7.5.4...7.5.4..."], [18, "0..2..4...3....."], [14, "5...5.4...3.2..."], [12, "2.4.5.4.2...0..."]],
      fx:   [[45, "i...........r..."], [25, "i.......c...r..."], [18, "............r..."], [12, "i...c.......c..."]]
    },
    rares: { drums: { "14:0": 3, "9:1": 2, "13:1": 0.6 }, bass: { "12:2": 3, "5:6": 2, "14:7": 0.6 },
             mel: { "9:6": 3, "15:1": 2, "11:7": 0.6 }, fx: { "6:2": 3, "8:1": 2, "15:2": 0.6 } },
    grail: { drums: "13:1", bass: "14:7", mel: "11:7", fx: "15:2" } },

  { id: "basement", name: "Basement", style: "Boom bap", bpm: 90, root: 9, scale: "aeolian",
    prompt: "Dusty drums, a walking low end. Dig past the obvious chop.",

/* ---------- helpers ---------- */
const pad2 = n => String(n).padStart(2, "0");
const pad3 = n => String(n).padStart(3, "0");
const r1 = x => Math.round(x * 10) / 10;
const laneOf = id => LANES.find(l => l.id === id);
const tok = (lane, step, row) => `${lane}:${step}:${row}`;
const scaleOf = pz => SCALES[pz.scale];
const keyLabel = pz => `${NOTES[pz.root]} ${scaleOf(pz).label}`;
const rowSemis = (pz, row) => { const iv = scaleOf(pz).iv, n = iv.length; return iv[row % n] + 12 * Math.floor(row / n); };
const rowPc = (pz, row) => (pz.root + rowSemis(pz, row)) % 12;
const isRootRow = (pz, row) => row % scaleOf(pz).iv.length === 0;
const bassMidi = (pz, row) => 24 + pz.root + (pz.root < 5 ? 12 : 0) + rowSemis(pz, row);
const melMidi = (pz, row) => 60 + pz.root - (pz.root > 6 ? 12 : 0) + rowSemis(pz, row);
const rowName = (L, pz, row) => (L.pitched ? NOTES[rowPc(pz, row)] : L.rows[row]);
const sortNotes = ns => ns.slice().sort((a, b) => a.step - b.step || a.row - b.row);

function parseLaneSeed(laneId, entry) {
  const [count, ...strs] = entry, notes = [];
  if (laneId === "drums") strs.forEach((s, row) => [...s].forEach((c, step) => { if (c === "x") notes.push({ step, row }); }));
  else [...strs[0]].forEach((c, step) => { if (c !== ".") notes.push({ step, row: laneId === "fx" ? "ric".indexOf(c) : +c }); });
  return { count, notes };
}
for (const pz of PUZZLES) {
  pz.L = {};
  for (const L of LANES) {
    const arche = pz.seed[L.id].map(e => parseLaneSeed(L.id, e)), counts = {};
    for (const a of arche) for (const n of a.notes) { const t = tok(L.id, n.step, n.row); counts[t] = (counts[t] || 0) + a.count; }
    const rares = {};
    for (const [k, c] of Object.entries(pz.rares[L.id])) { const t = `${L.id}:${k}`; rares[t] = c; counts[t] = (counts[t] || 0) + c; }
    pz.L[L.id] = { arche, rares, counts, valid: new Set(Object.keys(counts)), grail: `${L.id}:${pz.grail[L.id]}` };
  }
}

/* ---------- daily puzzle ---------- */
function dayNumber(date = new Date()) {
  const launch = Date.parse(CONFIG.LAUNCH_DATE + "T00:00:00Z");
  return Math.floor((Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()) - launch) / 864e5) + 1;
}
const puzzleForDay = n => PUZZLES[(((n - 1) % PUZZLES.length) + PUZZLES.length) % PUZZLES.length];

/* ---------- pool: faded seed + real scored runs (first run of the day only) ---------- */
const realPool = {};    // puzzleId -> { n, counts: {token: players}, weights: [crate weights] }
const realOf = pz => (realPool[pz.id] ||= { n: 0, counts: {}, weights: [] });
function shareOf(pz, laneId, t) {
  const real = realOf(pz), w = Math.max(0, 1 - real.n / CONFIG.SEED_FADE_SUBMISSIONS);
  const total = CONFIG.SEED_PLAYERS * w + real.n;
  return total ? ((pz.L[laneId].counts[t] || 0) * w + (real.counts[t] || 0)) / total : 0;
}
function addToPool(pz, beat, weight) {
  const real = realOf(pz); real.n++; real.weights.push(weight);
  for (const L of LANES) for (const n of beat[L.id]) { const t = tok(L.id, n.step, n.row); real.counts[t] = (real.counts[t] || 0) + 1; }
}
function tierOf(pz, laneId, t, share) {
  if (!pz.L[laneId].valid.has(t)) return CONFIG.DEAD;
  if (t === pz.L[laneId].grail && share < CONFIG.GRAIL.below) return CONFIG.GRAIL;
  return CONFIG.LADDER.find(x => share > x.above) || CONFIG.LADDER[CONFIG.LADDER.length - 1];
}

/* ---------- gate 1: visible rules (gate submit) + hidden checks (zero the lane) ---------- */
function visibleRules(pz, L, notes) {
  if (L.id === "drums") return [{ label: "Kick on 01", ok: notes.some(n => n.step === 0 && n.row === 0) }];
  if (L.id === "bass") return [{ label: "Root on 01", ok: notes.some(n => n.step === 0 && isRootRow(pz, n.row)) }];
  if (L.id === "mel") return [{ label: "3+ notes", ok: notes.length >= 3 }];
  return [{ label: "1+ FX", ok: notes.length >= 1 }];
}
function hiddenProblems(pz, L, notes) {
  const out = [], ns = sortNotes(notes);
  if (notes.length > L.budget) out.push("over the note budget");
  if (L.id === "drums") for (const [row, nm] of [[0, "kicks"], [1, "snares"]]) {
    let run = 0, max = 0;
    for (let s = 0; s < 16; s++) { run = ns.some(n => n.step === s && n.row === row) ? run + 1 : 0; max = Math.max(max, run); }
    if (max >= 4) out.push(`${max} ${nm} in a row`);
  }
  if (L.pitched) {
    let run = 1;
    for (let i = 1; i < ns.length; i++) { run = ns[i].row === ns[i - 1].row ? run + 1 : 1; if (run >= 4) { out.push("the same note 4+ times in a row (drone)"); break; } }
  }
  return out;
}
/* ---------- fit: a hard clash caps the lane at MUD_CAP ---------- */
function mudOf(pz, L, beat) {
  if (L.id === "drums") {
    const hits = beat.drums.filter(n => n.row === 0 && beat.drums.some(m => m.step === n.step && m.row === 1)).map(n => pad2(n.step + 1));
    return hits.length ? [`Mud: kick and snare fight on step ${hits.join(", ")}`] : [];
  }
  if (L.id === "mel") {
    const n = scaleOf(pz).iv.length;
    const hits = beat.mel.filter(m => beat.bass.some(b => b.step === m.step && b.row % n === m.row % n)).map(m => pad2(m.step + 1));
    return hits.length ? [`Mud: melody doubles the 808's note on step ${hits.join(", ")}`] : [];
  }
  return [];
}

/* ---------- one full run → crate weight ---------- */
function scoreRun(pz, beat) {
  const lanes = LANES.map(L => {
    const notes = sortNotes(beat[L.id]);
    const vis = visibleRules(pz, L, notes);
    const problems = hiddenProblems(pz, L, notes).concat(vis.filter(r => !r.ok).map(r => `rule not met: ${r.label}`));
    const scored = notes.map(n => {
      const t = tok(L.id, n.step, n.row), share = shareOf(pz, L.id, t), tier = tierOf(pz, L.id, t, share);
      return { token: t, step: n.step, row: n.row, share, tier: tier.id, tierName: tier.name, w: tier.w * L.mult };
    });
    const raw = scored.reduce((a, b) => a + b.w, 0), mud = mudOf(pz, L, beat);
    const total = problems.length ? 0 : raw * (mud.length ? CONFIG.MUD_CAP : 1);
    return { lane: L.id, round: L.round, mult: L.mult, notes: scored, raw: r1(raw), mud, problems, total: r1(total),
             grail: { token: pz.L[L.id].grail, found: scored.some(s => s.token === pz.L[L.id].grail) } };
  });
  const total = r1(lanes.reduce((a, b) => a + b.total, 0));
  return { puzzle_id: pz.id, lanes, total, tier: crateTier(total) };
}
const crateTier = w => CONFIG.CRATE_TIERS.reduce((t, [min, name]) => (w >= min ? name : t), CONFIG.CRATE_TIERS[0][1]);
const tierIdOfName = name => ({ "B-side": "bside", "White label": "white", "Promo": "promo", "Test press": "test", "Grail": "grail" })[name];

/* ---------- "heavier than X% of crates today": pretend crowd built from the seed ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hashStr = s => [...s].reduce((h, c) => (Math.imul(h, 31) + c.charCodeAt(0)) >>> 0, 7);
function crowdBeats(pz) {
  const rand = rng(hashStr(pz.id)), beats = [];
  for (let i = 0; i < CONFIG.CROWD_SAMPLE; i++) {
    const beat = {};
    for (const L of LANES) {
      const lane = pz.L[L.id]; let x = rand() * CONFIG.SEED_PLAYERS, pick = lane.arche[0];
      for (const a of lane.arche) { if ((x -= a.count) < 0) { pick = a; break; } }
      const notes = pick.notes.map(n => ({ ...n }));
      for (const [t, c] of Object.entries(lane.rares)) {
        if (rand() * CONFIG.SEED_PLAYERS >= c) continue;
        const [, s, r] = t.split(":").map(Number);
        if (notes.length >= L.budget || (L.mono && notes.some(n => n.step === s))) continue;
        notes.push({ step: s, row: r });
      }
      beat[L.id] = notes;
    }
    beats.push(beat);
  }
  return beats;
}
function heavierThan(pz, total) {
  const ws = crowdBeats(pz).map(b => scoreRun(pz, b).total).concat(realOf(pz).weights);
  return Math.round(100 * ws.filter(w => w < total).length / ws.length);
}

}
function shareText(no, res, streak, pzName) {
  return [`BEAT RARITY No.${pad3(no)} · ${pzName}`, `${res.tier} — crate ${res.total.toFixed(1)}${streak > 1 ? ` · streak ${streak}` : ""}`]
    .concat(LANES.map(L => `${L.short.padEnd(3)} ${laneStrip(res, L.id).map(t => EMOJI[t]).join("")}`)).join("\n");
}

/* ---------- scheduler (pure): step n always plays at start + n*stepDur, so it cannot drift ---------- */
function schedulerAdvance(state, now, lookahead, stepDur, emit) {
  if (state.start + state.n * stepDur < now) state.n = Math.ceil((now - state.start) / stepDur);   // woke late: skip, never burst
  while (state.start + state.n * stepDur < now + lookahead) {
    emit(state.n % CONFIG.STEPS, state.start + state.n * stepDur);
    state.n++;
  }
}
</script>

<!-- ============================================================
     AUDIO — synthesised kits, 808, melody voices, FX, reveal sounds
     ============================================================ -->
<script>
let ctx = null, master = null, noiseBuf = null;
function audioInit() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0.6;
    master.connect(comp).connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === "suspended") ctx.resume();
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function env(t, peak, dur, att = 0.002) {
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); return g;
}
function osc(t, type, f0, f1, dur, peak, out, glideT) {
  const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + (glideT || dur * 0.7));
  o.connect(env(t, peak, dur)).connect(out); o.start(t); o.stop(t + dur + 0.03); return o;
}
function nz(t, type, freq, q, dur, peak, out, att) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = Math.min(freq, 16000); f.Q.value = q;
  s.connect(f).connect(env(t, peak, dur, att)).connect(out); s.start(t); s.stop(t + dur + 0.03); return f;
}
const curves = {};
function shaper(drive) {
  if (!curves[drive]) { const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) c[i] = Math.tanh((i / 512 - 1) * (1 + drive)); curves[drive] = c; }
  const w = ctx.createWaveShaper(); w.curve = curves[drive]; return w;
}
const K = {
  kick(t, k) { const [f0, f1, dec, click] = k.kick; osc(t, "sine", f0, f1, dec, 1, master, 0.11); if (click) nz(t, "highpass", 3500, 0.7, 0.012, click, master); },
  snare(t, k) {
    const [freq, dec, tone, clap] = k.snare;
    if (clap) { [0, 0.011, 0.022].forEach(d => nz(t + d, "bandpass", freq * 0.7, 1.3, 0.028, 0.5, master)); nz(t + 0.03, "bandpass", freq * 0.65, 1, dec + 0.05, 0.45, master); }
    else nz(t, "bandpass", freq, 0.9, dec, 0.7, master);
    osc(t, "triangle", tone, tone * 0.78, 0.09, 0.3, master);
  },
  hat(t, k) { const [freq, dec] = k.hat; nz(t, "highpass", freq, 0.8, dec, 0.3, master); }
};
let bassVoice = null;
function bass(t, midi, glide, k) {        // monophonic 808: each note cuts the last; glide slides in from it
  const [dec, drive] = k.bass, f = mf(midi);
  if (bassVoice && bassVoice.end > t) {
    const g = bassVoice.g.gain; g.cancelAndHoldAtTime ? g.cancelAndHoldAtTime(t) : g.cancelScheduledValues(t);
    g.setTargetAtTime(0.0001, t, 0.012);
  }
  const prev = bassVoice && bassVoice.f;
  const o = ctx.createOscillator(); o.type = "sine";
  if (glide && prev) { o.frequency.setValueAtTime(prev, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.09); }
  else { o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.04); }
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.8, t + 0.006);
  g.gain.setValueAtTime(0.8, t + dec * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  o.connect(shaper(drive)).connect(g).connect(master); o.start(t); o.stop(t + dec + 0.05);
  bassVoice = { g, f, end: t + dec };
}
function mel(t, midi, k) {
  const [type, dec] = k.mel, f = mf(midi);
  if (type === "bell") {
    const c = ctx.createOscillator(), m = ctx.createOscillator(), mg = ctx.createGain();
    c.frequency.value = f; m.frequency.value = f * 3.5; mg.gain.setValueAtTime(f * 1.8, t); mg.gain.exponentialRampToValueAtTime(1, t + dec);
    m.connect(mg).connect(c.frequency); c.connect(env(t, 0.2, dec + 0.3)).connect(master);
    m.start(t); c.start(t); m.stop(t + dec + 0.35); c.stop(t + dec + 0.35);
  } else if (type === "keys") {
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400; lp.connect(master);
    osc(t, "triangle", f, f, dec, 0.22, lp); osc(t, "sine", f * 2.003, f * 2.003, dec * 0.6, 0.07, lp);
  } else if (type === "pluck") {
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 5;
    lp.frequency.setValueAtTime(5000, t); lp.frequency.exponentialRampToValueAtTime(300, t + dec * 0.8); lp.connect(master);
    osc(t, "sawtooth", f, f, dec, 0.22, lp);
  } else {
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600; lp.connect(master);
    const o = osc(t, "square", f, f, dec, 0.12, lp);
    const v = ctx.createOscillator(), vg = ctx.createGain(); v.frequency.value = 5.5; vg.gain.value = f * 0.012;
    v.connect(vg).connect(o.frequency); v.start(t); v.stop(t + dec + 0.05);
  }
}
const VOWELS = { a: [800, 1150], o: [500, 850], e: [400, 2100] };
const FX = {
  riser(t, dur, k) {
    const f = nz(t, "bandpass", 300, 2, dur, 0.28, master, dur * 0.95);
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(7000, t + dur);
    if (k.fx[0] === "tone") osc(t, "sawtooth", 180, 1400, dur, 0.06, master, dur);
  },
  impact(t) { osc(t, "sine", 75, 30, 1.0, 0.9, master, 0.5); nz(t, "lowpass", 1400, 0.7, 0.5, 0.45, master); },
  chop(t, midi, k) {
    const f = mf(midi), g = env(t, 0.5, 0.2, 0.01); g.connect(master);
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.setValueAtTime(f * 1.03, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05);
    for (const fq of VOWELS[k.fx[1]]) { const b = ctx.createBiquadFilter(); b.type = "bandpass"; b.frequency.value = fq; b.Q.value = 7; o.connect(b).connect(g); }
    o.start(t); o.stop(t + 0.22);
  }
};
const SFX = {   // weigh-in sound design: restraint everywhere else, drama here
  thunk(t, heavy) { osc(t, "sine", 130 - heavy * 6, 52, 0.16, 0.45 + heavy * 0.04, master, 0.06); nz(t, "lowpass", 900, 0.7, 0.03, 0.25, master); },
  stamp(t) { nz(t, "bandpass", 2400, 1.2, 0.05, 0.35, master); osc(t, "sine", 220, 160, 0.12, 0.3, master); },
  riser(t, dur) { const f = nz(t, "bandpass", 250, 2.5, dur, 0.32, master, dur * 0.95); f.frequency.setValueAtTime(250, t); f.frequency.exponentialRampToValueAtTime(8000, t + dur); osc(t, "sawtooth", 110, 880, dur, 0.05, master, dur); },
  subdrop(t) { osc(t, "sine", 95, 28, 1.3, 0.95, master, 0.9); nz(t, "lowpass", 600, 0.7, 0.4, 0.3, master); }
};
function playNote(pz, laneId, n, t, glide) {
  const k = pz.kit;
  if (laneId === "drums") K[["kick", "snare", "hat"][n.row]](t, k);
  else if (laneId === "bass") bass(t, bassMidi(pz, n.row), glide, k);
  else if (laneId === "mel") mel(t, melMidi(pz, n.row), k);
  else if (n.row === 0) FX.riser(t, Math.max(2, 16 - n.step) * 60 / pz.bpm / 4, k);
  else if (n.row === 1) FX.impact(t);
  else FX.chop(t, melMidi(pz, 0), k);
}

const Engine = {
  state: null, timer: null, raf: null, queue: [], onStep: null, src: null,
  stats: { scheduled: 0, late: 0, times: [], voices: { drums: 0, bass: 0, mel: 0, fx: 0 } },   // self-test counters
  start(src) {                  // src: () => ({ pz, beat, mute: Set of lane ids | null })
    audioInit(); this.src = src;
    if (this.state) return;
    this.state = { start: ctx.currentTime + 0.06, n: 0 };
    this.timer = setInterval(() => this.pump(), CONFIG.SCHEDULE_MS); this.pump();
    const tick = () => {
      let step = null;
      while (this.queue.length && this.queue[0].time <= ctx.currentTime) step = this.queue.shift().step;
      if (step !== null && this.onStep) this.onStep(step);
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  },
  pump() {
    const { pz, beat, mute } = this.src();
    schedulerAdvance(this.state, ctx.currentTime, CONFIG.LOOKAHEAD_S, 60 / pz.bpm / 4, (step, time) => {
      this.stats.scheduled++; if (time < ctx.currentTime) this.stats.late++;
      if (this.stats.times.length < 3000) this.stats.times.push(time);
      for (const L of LANES) {
        if (mute && mute.has(L.id)) continue;
        for (const n of beat[L.id]) if (n.step === step) { playNote(pz, L.id, n, time, n.glide); this.stats.voices[L.id]++; }
      }
      this.queue.push({ step, time });
    });
  },
  stop() {
    if (!this.state) return;
    clearInterval(this.timer); cancelAnimationFrame(this.raf);
    this.state = null; this.queue = [];
    if (bassVoice && ctx) { const g = bassVoice.g.gain; g.cancelScheduledValues(ctx.currentTime); g.setTargetAtTime(0.0001, ctx.currentTime, 0.02); bassVoice = null; }
    if (this.onStep) this.onStep(-1);
  },
  get running() { return !!this.state; }
};
</script>

<!-- ============================================================

<script>
const app = document.getElementById("app");

const TODAY = dayNumber();
const HASHDAY = (/^#day-(\d+)$/.exec(location.hash) || [])[1];      // #day-5 jumps to day 5 (practice) for testing
const fmtPct = s => (s === 0 ? "0%" : s < 0.01 ? "<1%" : s < 0.1 ? (s * 100).toFixed(1) + "%" : Math.round(s * 100) + "%");
const dLabel = n => dateOfDay(n).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }).toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const cardKey = n => `beatrarity:v2:day:${n}`;
function streakNow() { const s = store.get("beatrarity:v2:streak"); return s && s.last >= TODAY - 1 ? s.count : 0; }
function bumpStreak() {
  const s = store.get("beatrarity:v2:streak") || { last: 0, count: 0 };
  if (s.last === TODAY) return s.count;
  const count = s.last === TODAY - 1 ? s.count + 1 : 1;
  store.set("beatrarity:v2:streak", { last: TODAY, count }); return count;
}
// Today's scored run is part of the pool, so practice replays are scored against it.
(() => { const c = store.get(cardKey(TODAY)); if (c) addToPool(puzzleForDay(TODAY), c.beat, c.result.total); })();

const S = { screen: "start", day: HASHDAY ? +HASHDAY : TODAY, pz: null, practice: false, round: 1, beat: null, session: null,
            result: null, heavier: 0, streak: 0, deadline: 0, timer: null, glide: false, reveal: 0, listen: null, fast: false };
S.pz = puzzleForDay(S.day);
const emptyBeat = () => ({ drums: [], bass: [], mel: [], fx: [] });
const curLane = () => LANES[S.round - 1];
const blindNow = () => S.pz.twist === "blind-melody" && S.screen === "round" && S.round === 3;

/* ---------- transport ---------- */
const editSrc = () => ({ pz: S.pz, beat: S.beat, mute: blindNow() ? new Set(["mel"]) : null });
function play(src = editSrc) { Engine.start(src); syncPlay(); }
function stop() { Engine.stop(); S.listen = null; syncPlay(); }
function syncPlay() {
  document.querySelectorAll("[data-act=toggle]").forEach(b => { b.textContent = Engine.running ? "■ Stop" : "▶ Play"; b.classList.toggle("on", Engine.running); });
  document.querySelectorAll("[data-act=playBeat]").forEach(b => { const on = Engine.running && S.listen === "beat"; b.textContent = on ? "■ Stop" : "▶ Play your beat"; b.classList.toggle("on", on); });
  document.querySelectorAll(".gbtn:not(.found)").forEach(b => { const on = Engine.running && S.listen === b.dataset.lane; b.classList.toggle("on", on); b.querySelector(".gs").textContent = on ? "■ Stop" : "▶ Grail"; });
}
Engine.onStep = step => {
  document.querySelectorAll(".ph").forEach(c => c.classList.remove("ph"));
  if (step >= 0) document.querySelectorAll(`.c[data-s="${step}"],.m[data-s="${step}"]`).forEach(c => c.classList.add("ph"));
};
document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); });
document.addEventListener("keydown", e => {
  if (e.code === "Space" && S.screen === "round" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); Engine.running ? stop() : play(); }
});

/* ---------- views ---------- */
const vTop = () => `<header class="top"><div class="brand">BEAT<b>RARITY</b></div>
  <div class="meta">${S.practice ? '<span class="pr">Practice · </span>' : ""}No. ${pad3(S.day)} · ${dLabel(S.day)}<br>${S.pz.bpm} BPM · ${keyLabel(S.pz)}</div></header>`;

function vStart() {
  const card = S.day === TODAY ? store.get(cardKey(TODAY)) : null, streak = streakNow(), pz = S.pz;
  return `<div class="lbl">Daily beat · No. ${pad3(S.day)}${streak ? ` · <span class="streak">Streak ${streak}</span>` : ""}</div>
  <h1>${pz.name}${pz.twist ? '<span class="twist">Returns · blind melody</span>' : ""}</h1><p class="sub">${pz.prompt}</p>
  <div class="specs"><div><span class="lbl">Scale</span><b>${keyLabel(pz)}</b></div><div><span class="lbl">Tempo</span><b>${pz.bpm} BPM</b></div><div><span class="lbl">Kit</span><b>${pz.style}</b></div></div>
  <div class="rounds">${LANES.map(L => `<div class="${L.mult > 1 ? "drop" : ""}"><span class="lbl">Round ${pad2(L.round)}</span><b>${L.name}${L.mult > 1 ? '<span class="x2">2×</span>' : ""}</b><span class="n">${L.budget} notes</span></div>`).join("")}</div>
  <p class="how">Four rounds, ${CONFIG.ROUND_SECONDS} seconds each, one beat. <em>The fewer players who put a note where you did, the heavier it weighs.</em> Notes outside today's crate weigh nothing.</p>
  ${card ? `<div class="played"><div><span class="lbl">Today's crate</span><b>${card.result.tier} · ${card.result.total.toFixed(1)}</b></div><button class="btn" data-act="view">View weigh-in</button></div>` : ""}
  <button class="btn go big" data-act="start">${card || S.day !== TODAY ? "Practice run (unscored)" : "Start"}</button>
  <div class="links"><a href="#" data-act="archive">Archive</a>${S.day !== TODAY ? `<a href="#" data-act="today">Today's beat</a>` : ""}</div>`;
}
function vArchive() {
  const days = []; for (let d = TODAY - 1; d >= Math.max(1, TODAY - 30); d--) days.push(d);
  return `<div class="lbl">Archive</div><h2>Past beats</h2><p class="sub">Replay any past day. Archive runs are practice: unscored and kept out of the pool.</p>
  ${days.length ? `<div class="arch">${days.map(d => { const p = puzzleForDay(d); return `<button data-act="pickDay" data-day="${d}"><div><b>${p.name}</b><br><span>No. ${pad3(d)} · ${dLabel(d)} · ${keyLabel(p)}</span></div><span>${p.bpm} BPM</span></button>`; }).join("")}</div>`
    : `<p class="sub">The archive starts tomorrow — today is No. ${pad3(TODAY)}.</p>`}
  <div class="links"><a href="#" data-act="today">Back to today</a></div>`;
}
function vOverview() {
  const L0 = curLane();
  return `<div class="ov">${LANES.map(L => `<div class="ol ${L === L0 ? "cur" : ""}">${L.short}</div>` +
    Array.from({ length: 16 }, (_, s) => `<div class="m ${S.beat[L.id].some(n => n.step === s) ? "on" : ""} ${L === L0 ? "cur" : ""}" data-s="${s}"></div>`).join("")).join("")}</div>`;
}
function rowsOf(L) {
  if (L.id === "drums") return [2, 1, 0].map(r => ({ row: r, label: L.rows[r].toUpperCase() }));
  if (L.id === "fx") return [0, 1, 2].map(r => ({ row: r, label: L.rows[r].toUpperCase() }));
  return [7, 6, 5, 4, 3, 2, 1, 0].map(r => ({ row: r, label: NOTES[rowPc(S.pz, r)], root: isRootRow(S.pz, r) }));
}
function vEditor() {
  const L = curLane(), notes = S.beat[L.id], full = notes.length >= L.budget, cols = narrow.matches ? 8 : 16;
  const ch = L.pitched ? 30 : 40, n = scaleOf(S.pz).iv.length;
  const under = L.id === "mel" ? S.beat.bass : null;   // marks where the 808 sits, so melody clashes are visible
  return [0, 8].slice(0, 16 / cols).map(b => `<div class="ed" style="--cols:${cols};--ch:${ch}px">${rowsOf(L).map(r =>
    `<div class="rl ${r.root ? "root" : ""}">${r.label}</div>` + Array.from({ length: cols }, (_, i) => {
      const s = b + i, on = notes.find(x => x.step === s && x.row === r.row);
      const spent = !on && full && !(L.mono && notes.some(x => x.step === s));
      const ctxm = under && under.some(x => x.step === s && x.row % n === r.row % n);
      return `<button class="c ${(s >> 2) & 1 ? "alt" : ""} ${on ? "on" : ""} ${on && on.glide ? "g" : ""} ${spent ? "spent" : ""} ${ctxm ? "ctx" : ""}" data-act="cell" data-s="${s}" data-r="${r.row}" aria-label="${r.label} step ${s + 1}" aria-pressed="${!!on}"></button>`;
    }).join("")).join("")}<div></div>${Array.from({ length: cols }, (_, i) => `<div class="sn">${b + i + 1}</div>`).join("")}</div>`).join("");
}
function vChips() {
  const L = curLane(), notes = S.beat[L.id], used = notes.length;
  return visibleRules(S.pz, L, notes).map(r => `<div class="chip ${r.ok ? "ok" : ""}"><i></i>${r.label}</div>`).join("") +
    `<div class="budget ${used >= L.budget ? "spent" : ""}"><span>${used} / ${L.budget} notes used</span><span class="segs">${Array.from({ length: L.budget }, (_, i) => `<i class="${i < used ? "used" : ""}"></i>`).join("")}</span></div>` +
    (blindNow() ? `<div class="chip blind">Blind round — you'll hear it at the weigh-in</div>` : "") +
    (L.mult > 1 ? `<div class="chip ok"><i></i>Counts 2×</div>` : "");
}
function vRound() {
  const L = curLane();
  return `<div class="prog">${LANES.map(x => `<div class="${x.round < S.round ? "done" : x.round === S.round ? "cur" : ""}">${pad2(x.round)} ${x.name}</div>`).join("")}</div>
  <div class="rhead"><div><div class="lbl">Round ${pad2(L.round)} of 04</div><h2>${L.name}${L.mult > 1 ? '<span class="x2">2×</span>' : ""}</h2></div><div class="timer" id="timer">0:${CONFIG.ROUND_SECONDS}</div></div>
  <div id="ov">${vOverview()}</div><div class="chips" id="chips">${vChips()}</div><div id="ed">${vEditor()}</div>
  <div class="toolbar"><button class="btn" data-act="toggle">▶ Play</button><button class="btn" data-act="clear">Clear</button>
    ${L.id === "bass" ? `<button class="btn ${S.glide ? "on" : ""}" data-act="glide">Glide ${S.glide ? "on" : "off"}</button>` : ""}
    <button class="btn go" id="go" data-act="lock" ${visibleRules(S.pz, L, S.beat[L.id]).every(r => r.ok) ? "" : "disabled"}>${L.round < 4 ? "Lock in" : "Lock in & weigh"} →</button></div>
  <p class="fine">${L.id === "bass" ? "Glide on: new notes slide in from the previous note (marked ◤). " : ""}${L.id === "mel" ? "Grey underlines show where the 808 plays the same note. " : ""}${L.mono ? "One note per step — tap another row to move it. " : ""}Tap a note again to remove it.</p>`;
}
function refreshRound() {
  const L = curLane();
  document.getElementById("ov").innerHTML = vOverview();
  document.getElementById("chips").innerHTML = vChips();
  document.getElementById("ed").innerHTML = vEditor();
  document.getElementById("go").disabled = !visibleRules(S.pz, L, S.beat[L.id]).every(r => r.ok);
}

/* ---------- weigh-in view ---------- */
const stampLabel = (L, n) => `${L.pitched ? NOTES[rowPc(S.pz, n.row)] : L.rows[n.row][0]}${pad2(n.step + 1)}`;
function dialSvg() {
  const cx = 160, cy = 170, R = 130, pt = f => { const a = Math.PI * (1 - f); return [cx + R * Math.cos(a), cy - R * Math.sin(a)]; };
  const T = CONFIG.CRATE_TIERS.map(([m]) => m / CONFIG.SCALE_MAX).concat([1]), cols = ["#3a3a42", "#77746e", "#b08a5e", "#ff7a1a", "#ffd23f"];
  let arcs = "", ticks = "";
  for (let i = 0; i < 5; i++) if (T[i] < 1) { const [x1, y1] = pt(T[i]), [x2, y2] = pt(Math.min(T[i + 1], 1)); arcs += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}" stroke="${cols[i]}" stroke-width="10" fill="none"/>`; }
  for (let i = 0; i <= 22; i++) { const f = i / 22, a = Math.PI * (1 - f), [x1, y1] = pt(f), r2 = R - (i % 2 ? 9 : 17); ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy - r2 * Math.sin(a)).toFixed(1)}" stroke="#4a4a52" stroke-width="1.5"/>`; }
  return `<svg class="dial" viewBox="0 0 320 185" aria-hidden="true">${arcs}${ticks}
    <g id="needle" style="transform:rotate(-90deg)"><line x1="160" y1="170" x2="160" y2="50" stroke="#ecebe8" stroke-width="3" stroke-linecap="round"/></g>
    <circle cx="160" cy="170" r="8" fill="#ecebe8"/></svg>`;
}
function vReveal() {
  const T = id => (id === "grail" ? CONFIG.GRAIL : id === "dead" ? CONFIG.DEAD : CONFIG.LADDER.find(x => x.id === id));
  return `<div class="dialwrap">${dialSvg()}<div class="badge2" id="x2">2×</div>
    <div class="readout"><div class="w" id="wt">0.0</div><div class="u">Crate weight</div></div></div>
  <div class="wrows">${LANES.map(L => `<div class="wrow" id="row-${L.id}"><div class="wn">${L.name}${L.mult > 1 ? " 2×" : ""}</div><div class="stamps" id="st-${L.id}"></div><div class="wt" id="sub-${L.id}"></div></div>`).join("")}</div>
  <div class="legend">${["dead", "bside", "white", "promo", "test", "grail"].map(id => `<span><i class="${id}"></i>${T(id).name} ${T(id).w}</span>`).join("")}</div>
  <button class="skip" id="skip" data-act="skip">Skip weigh-in</button>
  <div class="final" id="final">${vFinal()}</div>`;
}
function vFinal() {
  const R = S.result, streak = S.practice ? 0 : S.streak, tid = tierIdOfName(R.tier);
  return `<span class="tierstamp ${tid === "grail" ? "grail" : ""}">${R.tier}</span>
  <p class="heavier">Heavier than <b>${S.heavier}%</b> of crates today${S.practice ? " <span style='color:var(--dim)'>(practice — not counted)</span>" : ""}.</p>
  <div class="sec"><span class="lbl">Listen</span><button class="btn go big" data-act="playBeat">▶ Play your beat</button></div>
  <div class="sec"><span class="lbl">The Grails</span><div class="grails">${LANES.map(L => {
    const g = R.lanes.find(l => l.lane === L.id).grail, [, s, r] = g.token.split(":").map(Number);
    return `<button class="gbtn ${g.found ? "found" : ""}" data-act="grail" data-lane="${L.id}" ${g.found ? "disabled" : ""}>
      <span class="gl">${g.found ? `You found the ${L.name.replace(/^The /, "")} Grail` : `Hear the ${L.name.replace(/^The /, "")} Grail you missed`}<small>${rowName(L, S.pz, r)} on step ${pad2(s + 1)} · played in your beat</small></span><span class="gs">${g.found ? "✓ Found" : "▶ Grail"}</span></button>`;
  }).join("")}</div></div>
  <div class="sec"><span class="lbl">Share</span><div class="sharewrap">
    <div class="card" id="card"><div class="ch"><span>BEAT<b>RARITY</b></span><span>No.${pad3(S.day)}</span></div>
      <span class="ct ${tid === "grail" ? "grail" : ""}">${R.tier}</span>
      <div class="cd">${R.total.toFixed(1)}<small>CRATE</small></div>
      <div class="grid">${LANES.map(L => `<span>${L.short}</span>` + laneStrip(R, L.id).map(t => `<i class="${t === "none" ? "" : t}"></i>`).join("")).join("")}</div>
      <div class="cf"><span>${streak ? `STREAK <b>${streak}</b>` : S.pz.name.toUpperCase()}</span><span>${dLabel(S.day)} · ${S.pz.bpm} BPM</span></div></div>
    <div class="shareact"><button class="btn go" data-act="copyShare">Copy share text</button><button class="btn" data-act="home">Done</button>
      <span class="fine" id="copymsg"></span></div></div></div>
  <details><summary>Choice log (JSON)</summary><textarea readonly>${JSON.stringify(S.session, null, 2)}</textarea><button class="btn" data-act="copyLog">Copy log JSON</button></details>`;
}

/* ---------- the weigh-in state machine: intro → per lane (surge?) → lane → notes → subtotal → final ---------- */
function setNeedle(w) { const el = document.getElementById("needle"); if (el) el.style.transform = `rotate(${-90 + 180 * Math.min(1, w / CONFIG.SCALE_MAX)}deg)`; }
let shown = 0;
function setReadout(w) {
  const el = document.getElementById("wt"); if (!el) return;
  const from = shown, t0 = performance.now(); shown = w;
  const step = now => { const k = Math.min(1, (now - t0) / 220); el.textContent = (from + (w - from) * k).toFixed(1); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function weighSteps(R) {
  const steps = [{ t: "intro" }];
  for (const L of LANES) {
    const lane = R.lanes.find(l => l.lane === L.id);
    if (L.mult > 1) steps.push({ t: "surge", L });
    steps.push({ t: "lane", L });
    lane.notes.forEach(n => steps.push({ t: "note", L, n }));
    steps.push({ t: "sub", L, lane });
  }
  steps.push({ t: "final" });
  return steps;
}
async function runWeighIn() {
  const id = ++S.reveal, R = S.result, D = CONFIG.REVEAL;
  let running = 0, banked = 0; shown = 0; S.weighLog = [];
  audioInit();
  for (const st of weighSteps(R)) {
    if (id !== S.reveal) return;
    const fast = S.fast, now = ctx.currentTime + 0.01, wait = ms => sleep(fast ? 0 : ms);
    S.weighLog.push(st.t);
    if (st.t === "intro") await wait(400);
    else if (st.t === "surge") {
      if (!fast) SFX.riser(now, D.SURGE_MS / 1000);
      document.getElementById("x2").classList.add("flash");
      setNeedle(banked + CONFIG.SCALE_MAX * 0.15); await wait(D.SURGE_MS * 0.6);
      setNeedle(banked); await wait(D.SURGE_MS * 0.4);
    } else if (st.t === "lane") {
      document.getElementById(`row-${st.L.id}`).classList.add("live"); await wait(D.LANE_MS);
    } else if (st.t === "note") {
      const n = st.n, el = document.createElement("span");
      el.className = `ns ${n.tier}`; el.title = `${n.tierName} · ${fmtPct(n.share)} of players`;
      el.innerHTML = `${stampLabel(st.L, n)} <b>${n.w.toFixed(1)}</b>`;
      document.getElementById(`st-${st.L.id}`).appendChild(el);
      running += n.w; setNeedle(running); setReadout(running);
      if (!fast) SFX.thunk(now, Math.min(12, n.w));
      await wait(D.NOTE_MS);
    } else if (st.t === "sub") {
      const lane = st.lane, row = document.getElementById(`row-${st.L.id}`);
      banked += lane.total; running = banked;
      document.getElementById(`sub-${st.L.id}`).innerHTML = `${lane.total.toFixed(1)}${lane.problems.length ? "<small>invalid</small>" : lane.mud.length ? "<small>mud ×0.5</small>" : lane.mult > 1 ? "<small>doubled</small>" : ""}`;
      if (lane.problems.length) row.insertAdjacentHTML("beforeend", `<div class="wnote bad">Invalid: ${lane.problems.join("; ")} — lane scores 0.</div>`);
      else lane.mud.forEach(t => row.insertAdjacentHTML("beforeend", `<div class="wnote">${t} — lane capped at 50%.</div>`));
      row.classList.remove("live"); row.classList.add("done");
      setNeedle(running); setReadout(running);
      if (!fast) SFX.stamp(now);
      await wait(D.SUB_MS);
    } else if (st.t === "final") {
      setNeedle(R.total); setReadout(R.total);
      SFX.subdrop(now);
      document.getElementById("skip").style.display = "none";
      document.getElementById("final").classList.add("show");
      await sleep(D.FINAL_MS);
    }
  }
  S.weighDone = true;
}

/* ---------- render ---------- */
function render() {
  const v = { start: vStart, archive: vArchive, round: vRound, reveal: vReveal }[S.screen]();
  app.innerHTML = vTop() + `<main class="screen">${v}</main>`;
  syncPlay(); window.scrollTo(0, 0);
}
narrow.addEventListener("change", () => { if (S.screen === "round") refreshRound(); });

/* ---------- flow ---------- */
function startRun() {
  audioInit(); stop();
  const scored = S.day === TODAY && !store.get(cardKey(TODAY));
  Object.assign(S, { practice: !scored, round: 1, beat: emptyBeat(), result: null, glide: false, fast: false, weighDone: false,
    session: { puzzle_id: S.pz.id, puzzle_no: S.day, practice: !scored, session_id: Math.random().toString(36).slice(2, 10), started_ts: new Date().toISOString(), choices: [] } });
  S.screen = "round"; render(); startTimer(); play();
}
function startTimer() {
  clearInterval(S.timer); S.deadline = Date.now() + CONFIG.ROUND_SECONDS * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000)), el = document.getElementById("timer");
    if (el) { el.textContent = `${Math.floor(left / 60)}:${pad2(left % 60)}`; el.classList.toggle("low", left <= 10); }
    if (left <= 0) lock();
  };
  tick(); S.timer = setInterval(tick, 200);
}
function lock() {     // also called when the timer runs out; unmet visible rules then zero the lane at scoring
  clearInterval(S.timer);
  const L = curLane();
  for (const n of sortNotes(S.beat[L.id])) S.session.choices.push(Object.assign({ round: L.round, lane: L.id, kind: L.kind, token: tok(L.id, n.step, n.row) }, n.glide ? { glide: true } : {}));
  if (S.round < 4) { S.round++; S.glide = false; render(); startTimer(); return; }
  finish();
}
function finish() {
  stop();
  S.result = scoreRun(S.pz, S.beat);
  S.heavier = heavierThan(S.pz, S.result.total);
  S.streak = 0;
  if (!S.practice) {
    addToPool(S.pz, S.beat, S.result.total);
    S.streak = bumpStreak();
    store.set(cardKey(TODAY), { result: S.result, beat: S.beat, log: S.session, heavier: S.heavier });
  }
  S.screen = "reveal"; render(); runWeighIn();
}
function toggleCell(s, r) {
  const L = curLane(), notes = S.beat[L.id];
  const at = notes.findIndex(n => n.step === s && n.row === r);
  if (at >= 0) { notes.splice(at, 1); refreshRound(); return; }
  const col = L.mono ? notes.findIndex(n => n.step === s) : -1;
  if (col >= 0) notes[col].row = r;
  else if (notes.length < L.budget) notes.push(Object.assign({ step: s, row: r }, L.id === "bass" && S.glide ? { glide: true } : {}));
  else return;
  if (!blindNow()) { audioInit(); playNote(S.pz, L.id, { step: s, row: r }, ctx.currentTime + 0.005, false); }
  refreshRound();
}
async function copyText(text, msg) {
  const say = t => { const m = document.getElementById("copymsg"); if (m) m.textContent = t; };
  try { await navigator.clipboard.writeText(text); say(msg); return; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove();
  say(ok ? msg : "Copy blocked here — screenshot the card instead.");
}
function listen(id, beat) { stop(); play(() => ({ pz: S.pz, beat })); S.listen = id; syncPlay(); }
const ACT = {
  start: startRun,
  view() {
    const c = store.get(cardKey(TODAY));
    Object.assign(S, { result: c.result, beat: c.beat, session: c.log, heavier: c.heavier, practice: false, fast: true, streak: streakNow() });
    S.screen = "reveal"; render(); runWeighIn();
  },
  archive(el, e) { e.preventDefault(); stop(); S.screen = "archive"; render(); },
  today(el, e) { e.preventDefault(); stop(); S.day = TODAY; S.pz = puzzleForDay(TODAY); S.practice = false; S.screen = "start"; render(); },
  pickDay(el) { S.day = +el.dataset.day; S.pz = puzzleForDay(S.day); S.practice = true; S.screen = "start"; render(); },
  toggle() { Engine.running ? stop() : play(); },
  cell(el) { if (!el.classList.contains("spent")) toggleCell(+el.dataset.s, +el.dataset.r); },
  clear() { S.beat[curLane().id] = []; refreshRound(); },
  glide(el) { S.glide = !S.glide; el.classList.toggle("on", S.glide); el.textContent = `Glide ${S.glide ? "on" : "off"}`; },
  lock: () => lock(),
  skip() { S.fast = true; },
  playBeat() { if (Engine.running && S.listen === "beat") return stop(); listen("beat", S.beat); },
  grail(el) {
    const id = el.dataset.lane;
    if (Engine.running && S.listen === id) return stop();
    const L = laneOf(id), [, s, r] = S.result.lanes.find(l => l.lane === id).grail.token.split(":").map(Number);
    const beat = JSON.parse(JSON.stringify(S.beat));
    if (L.mono) beat[id] = beat[id].filter(n => n.step !== s);
    beat[id].push({ step: s, row: r });
    S.grailBeat = beat; listen(id, beat);
  },
  copyShare() { copyText(shareText(S.day, S.result, S.practice ? 0 : S.streak, S.pz.name), "Copied — paste it anywhere."); },
  copyLog() { copyText(JSON.stringify(S.session, null, 2), "Log copied."); },
  home() { stop(); S.reveal++; S.screen = "start"; render(); }
};
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
render();
</script>
