/* Direction: Panel — Roland TR-808 front panel + a cream VU meter.
   Silkscreen labels in Archivo Narrow (uppercase), every number in Chivo Mono. Tier colours = 808 step keys. */
:root{
  --bg:#141210; --panel:#1d1b18; --panel2:#24221e; --line:#2f2c28; --line2:#3c3833;
  --text:#efe8da; --muted:#a39b8e; --dim:#6f685e;
  --acc:#ee5a24; --acc-hi:#ff7843; --acc-lo:#5c2a16; --acc-bg:#23170f; --on-acc:#140c06; --bad:#e5484d;
  --t-dead:#3b2f27; --t-bside:#8a8378; --t-white:#efe6cf; --t-promo:#f2c230; --t-test:#f08a24; --t-grail:#ee3b24; --t-fresh:#5fd3b0;
  --face:#e9e0cb; --face-ink:#2a2520;
  --mono:"Chivo Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --r:0px; --r-lg:0px;
  --pixel:"Silkscreen","Archivo Narrow",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--text);outline-offset:2px}
a{color:var(--muted)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 72px}
.lbl{font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font:700 15px/1 var(--sans);letter-spacing:.16em}
.brand b{color:var(--acc);font-weight:700}
.meta{font:400 11.5px/1.5 var(--mono);color:var(--muted);text-align:right}
.meta .pr{color:var(--acc)}
.screen{animation:in .16s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.ns,.tierstamp,.final.show{animation:none!important}}
h1{font:700 36px/1.05 var(--sans);letter-spacing:-.005em;margin:8px 0 10px;text-wrap:balance}
h2{font:700 24px/1.15 var(--sans);letter-spacing:.02em;text-transform:uppercase;margin:4px 0}
.sub{color:var(--muted);margin:0 0 18px;max-width:600px}
.fine{color:var(--dim);font-size:14px;margin:10px 0 0}

/* buttons */
.btn{height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2);font:600 13px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px);background:var(--panel)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.go{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.go:hover:not(:disabled){background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.big{width:100%;height:54px;font-size:14px}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.go.on{background:var(--panel2);color:var(--acc)}

/* start */
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin:20px 0}
.specs div{background:var(--panel);padding:12px 14px;min-width:0}
.specs b{display:block;font:500 14px/1.25 var(--mono);margin-top:6px}
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 20px}
.rounds div{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;background:var(--panel)}
.rounds b{display:block;font:700 17px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.03em;margin:6px 0 2px}
.rounds span.n{font:400 12px/1 var(--mono);color:var(--muted)}
.rounds .drop{border-color:var(--acc-lo);background:var(--acc-bg)}
.x2{display:inline-block;font:500 11px/1 var(--mono);color:var(--on-acc);background:var(--acc);border-radius:2px;padding:3px 5px;margin-left:8px;vertical-align:3px}
.how{color:var(--muted);font-size:15px;margin:0 0 22px;max-width:600px}
.how em{color:var(--text);font-style:normal}
.played{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--acc-lo);background:var(--acc-bg);border-radius:var(--r-lg);margin-bottom:12px}
.played b{display:block;font:500 16px/1.3 var(--mono);margin-top:4px;color:var(--acc)}
.streak{color:var(--acc)}
.twist{display:inline-block;margin-left:10px;font:600 11px/1 var(--sans);letter-spacing:.1em;padding:5px 7px;border-radius:2px;border:1px solid var(--t-promo);color:var(--t-promo);vertical-align:8px;text-transform:uppercase}
.links{display:flex;justify-content:center;gap:20px;margin-top:18px;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}

/* round */
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.prog div{border-top:2px solid var(--line2);padding-top:8px;font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden}
.prog .done{border-color:var(--acc-lo);color:var(--muted)}
.prog .cur{border-color:var(--acc);color:var(--text)}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.timer{font:500 30px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer.low{color:var(--acc)}
.ov{display:grid;grid-template-columns:44px repeat(16,1fr);gap:3px 2px;padding:10px;border:1px solid var(--line);border-radius:var(--r-lg);background:#100f0d;margin-bottom:14px}
.ov .ol{font:600 10px/10px var(--sans);letter-spacing:.08em;color:var(--dim)}
.ov .ol.cur{color:var(--acc)}
.ov .m{height:10px;border-radius:1px;background:#1e1c19}
.ov .m.on{background:#6b655b}
.ov .m.on.cur{background:var(--acc)}
.ov .m.ph{outline:1px solid #efe8da70}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);font:600 13px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim)}
.chip.ok{border-color:var(--acc);color:var(--text)}
.chip.ok i{background:var(--acc);border-color:var(--acc)}
.chip.blind{border-color:var(--t-promo);color:var(--t-promo)}
.budget{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);font:400 12.5px/1 var(--mono)}
.budget .segs{display:flex;gap:3px}
.budget .segs i{width:7px;height:14px;border-radius:1px;background:var(--acc)}
.budget .segs i.used{background:#2f2c28}
.budget.spent{border-color:var(--acc-lo);color:var(--acc)}
.ed{display:grid;grid-template-columns:52px repeat(var(--cols),1fr);gap:4px}
.ed + .ed{margin-top:14px}
.rl{font:600 11px/1 var(--sans);letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;white-space:nowrap}
.rl.root{color:var(--t-promo)}
.c{position:relative;-webkit-touch-callout:none;user-select:none;height:var(--ch,34px);min-width:0;border-radius:var(--r);background:#1d1b18;border:1px solid #2c2925;transition:background .05s}
.c.alt{background:#25221e}
.c:hover:not(.spent):not(.on){border-color:var(--muted)}
.c.on{background:var(--acc);border-color:var(--acc-hi)}
.c.on.g::before{content:"";position:absolute;left:3px;top:3px;width:0;height:0;border-left:7px solid var(--on-acc);border-bottom:7px solid transparent}
.c.ph{box-shadow:inset 0 0 0 1.5px #efe8da99}
.c.ph:not(.on){background:#2d2a25}
.c.on.ph{background:var(--acc-hi)}
.c.spent{opacity:.28;cursor:not-allowed}
.c.ctx:not(.on){box-shadow:inset 0 -3px 0 #6b655b}
.sn{font:400 9.5px/1 var(--mono);color:var(--dim);text-align:center;padding-top:3px}
.toolbar{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.toolbar .go{margin-left:auto}

/* ---------- weigh-in: a meter, a number, a stamp; everything else steps back ---------- */
.res{max-width:560px}
.dialwrap{position:relative;max-width:340px}
.dial{width:100%;display:block}
#needle{transform-box:view-box;transform-origin:160px 170px;transition:transform .42s cubic-bezier(.3,1.35,.5,1)}
.readout{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.readout .w{font:500 76px/.95 var(--mono);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.readout .u{font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.badge2{position:absolute;right:0;top:0;font:500 15px/1 var(--mono);color:var(--on-acc);background:var(--acc);padding:6px 8px;border-radius:2px;opacity:0}
.badge2.flash{animation:flash 1.3s linear 1 forwards}
@keyframes flash{0%,23%,46%,69%{opacity:1}11%,34%,57%,80%{opacity:.1}100%{opacity:0}}
.wrows{margin-top:36px}
.wrow{display:grid;grid-template-columns:76px 1fr 56px;gap:6px 12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);opacity:.4;transition:opacity .2s}
.wrow:last-child{border-bottom:1px solid var(--line)}
.wrow.live,.wrow.done{opacity:1}
.wrow .wn{font:600 12px/1.3 var(--sans);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.wrow.live .wn{color:var(--text)}
.wrow .wt{font:500 16px/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.wrow .wt small{display:block;font:400 10px/1.4 var(--mono);color:var(--dim);margin-top:3px}
.stamps{display:flex;flex-wrap:wrap;gap:3px 12px;min-height:18px}
.ns{font:400 12.5px/1.45 var(--mono);white-space:nowrap;animation:drop .22s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.ns b{font-weight:500}
.ns.dead{color:var(--dim);text-decoration:line-through}
.ns.bside{color:var(--t-bside)}
.ns.white{color:var(--t-white)}
.ns.promo{color:var(--t-promo)}
.ns.test{color:var(--t-test)}
.ns.grail{color:var(--t-grail);font-weight:700}
.wnote{grid-column:2/4;font-size:13px;color:var(--t-promo)}
.wnote.bad{color:var(--bad)}
.key{font:400 11px/1.7 var(--mono);color:var(--dim);margin:12px 0 0}
.key span{white-space:nowrap}
.final{display:none}
.final.show{display:block;animation:in .2s ease-out}
#final{margin-top:22px}
.tierstamp{display:inline-block;font:700 22px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:9px 13px 8px;border:2px solid currentColor;outline:1px solid currentColor;outline-offset:3px;color:var(--acc);transform:rotate(-3deg);margin-left:5px;animation:stamp .18s ease-out}
.tierstamp.grail{color:var(--t-grail)}
@keyframes stamp{from{transform:rotate(-3deg) scale(1.3);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.heavier{font:400 18px/1.4 var(--sans);color:var(--muted);margin:22px 0 0}
.heavier b{font:500 18px/1 var(--mono);color:var(--text)}
.heavier .pr{color:var(--dim);font-size:14px}
.playrow{margin-top:26px}
.grails{margin-top:26px}
.gbtn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.gbtn:last-child{border-bottom:1px solid var(--line)}
.gbtn .gl{font:400 16px/1.3 var(--sans)}
.gbtn .gl small{display:block;font:400 12px/1.5 var(--mono);color:var(--muted)}
.gbtn .gs{font:500 12px/1 var(--mono);color:var(--t-grail);white-space:nowrap}
.gbtn:hover:not(.found) .gl{color:var(--t-white)}
.gbtn.on .gl{color:var(--t-grail)}
.gbtn.found{cursor:default}
.gbtn.found .gs{color:var(--muted)}
.skip{display:block;margin:16px 0 0;font:600 11px/1 var(--sans);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:8px 0}
#final-share{margin-top:56px}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:0 22px 18px;overflow:hidden}
.card .rule{height:6px;margin:0 -22px 18px;background:linear-gradient(90deg,var(--t-grail) 0 25%,var(--t-test) 25% 50%,var(--t-promo) 50% 75%,var(--t-white) 75%)}
.card .ch{display:flex;justify-content:space-between;font:400 11px/1 var(--mono);color:var(--muted)}
.card .ch span:first-child{font:700 12px/1 var(--sans);letter-spacing:.16em;color:var(--text)}
.card .cd{font:500 58px/1 var(--mono);margin-top:22px;letter-spacing:-.045em}
.card .cd small{font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--muted);margin-left:8px}
.card .ct{display:inline-block;margin:16px 0 0 4px;font:700 14px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:6px 9px 5px;border:1.5px solid currentColor;outline:1px solid currentColor;outline-offset:2px;color:var(--acc);transform:rotate(-3deg)}
.card .ct.grail{color:var(--t-grail)}
.card .grid{margin-top:20px;display:grid;grid-template-columns:30px repeat(16,1fr);gap:3px 2px;align-items:center}
.card .grid span{font:400 9px/1 var(--mono);color:var(--dim)}
.card .grid i{height:11px;border-radius:1px;background:#2a2723}
.card .cf{display:flex;justify-content:space-between;margin-top:18px;font:400 10.5px/1 var(--mono);color:var(--muted)}
.card .cf b{color:var(--text);font-weight:500}
i.dead{background:var(--t-dead)!important} i.misfit{background:#5a1f1a!important;box-shadow:inset 0 0 0 1px var(--bad)} i.fresh{background:var(--t-fresh)!important} i.bside{background:var(--t-bside)!important} i.white{background:var(--t-white)!important}
i.promo{background:var(--t-promo)!important} i.test{background:var(--t-test)!important} i.grail{background:var(--t-grail)!important}
.shareact{display:flex;align-items:center;gap:20px;margin-top:16px;flex-wrap:wrap}
.textbtn{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 0}
.textbtn:hover{color:var(--text)}
details{margin-top:10px}
summary{cursor:pointer;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:10px 0}
textarea{width:100%;height:200px;margin:8px 0;background:#0c0b0a;color:var(--muted);border:1px solid var(--line);border-radius:var(--r);font:12px/1.45 var(--mono);padding:10px;resize:vertical}
textarea:focus{border-color:var(--text);outline:none}
.arch{display:grid;gap:8px}
.arch button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);text-align:left}
.arch button:hover{border-color:var(--muted)}
.arch b{font:700 18px/1.2 var(--sans)}
.arch span{font:400 12px/1.4 var(--mono);color:var(--muted)}
@media (max-width:560px){
  h1{font-size:30px}
  .specs b{font-size:12px}
  .rounds{grid-template-columns:repeat(2,1fr)}
  .ed{grid-template-columns:38px repeat(var(--cols),1fr)}
  .rl{font-size:10px}
  .ov{grid-template-columns:32px repeat(16,1fr);padding:8px}
  .toolbar .go{flex:1 1 100%;margin-left:0;height:52px}
  .readout .w{font-size:68px}
  .wrow{grid-template-columns:64px 1fr 50px}
  .card{max-width:none}
}
/* ---------- pixel sprites ---------- */
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:bottom}
.scene{display:flex;align-items:flex-end;gap:6px;padding-bottom:10px;border-bottom:2px solid var(--line2);margin:4px 0 22px;width:max-content;max-width:100%}
.dig{position:relative;display:inline-block;width:64px;height:64px}
.dig img{position:absolute;inset:0}
.dig img:last-child{animation:dig 1s steps(1,end) infinite}
@keyframes dig{0%{opacity:0}50%{opacity:1}}
.lane-ico{margin-right:12px;vertical-align:-4px}
.rec{display:inline-block;width:var(--sz);height:var(--sz);background-size:calc(var(--sz) * 4) var(--sz);background-repeat:no-repeat;background-position:0 0;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.rec.spinning{animation:spin .44s steps(4) infinite}
@keyframes spin{to{background-position:calc(var(--sz) * -4) 0}}
.tierrow{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.readout .crate{margin-left:auto;align-self:flex-end}
.gbtn{grid-template-columns:auto 1fr auto}
.gbtn .gi{opacity:1}
.gbtn.found .gi{filter:grayscale(1);opacity:.5}
.card .cdrow{display:flex;justify-content:space-between;align-items:flex-end}
.spr{display:inline-block;width:var(--w);height:var(--h);background-repeat:no-repeat;background-size:calc(var(--w) * var(--n)) var(--h);background-position:0 0;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.spr.f1{background-position:calc(var(--w) * -1) 0}
.spr.loop{animation:frames var(--dur) steps(var(--n)) infinite}
@keyframes frames{to{background-position:calc(var(--w) * var(--n) * -1) 0}}
.scene{gap:10px;padding-bottom:12px}
.booth{display:flex;align-items:flex-end;gap:12px;padding:0 0 10px;margin:-4px 0 12px;border-bottom:2px solid var(--line2);width:max-content}
.booth #spk{margin-left:8px}
.seg{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:var(--r);height:44px;overflow:hidden}
.seg .lbl{padding:0 10px 0 12px}
.seg button{width:40px;height:100%;font:500 15px/1 var(--mono);border-left:1px solid var(--line2);color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.c.span::after{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--acc-lo)}
.c.chordn{box-shadow:inset 3px 0 0 var(--acc-hi)}
.goal{margin:6px 0 0;font-size:14px;color:var(--muted)}
.tip{margin-top:26px;padding:2px 0 2px 16px;border-left:2px solid var(--acc)}
.tip p{margin:0 0 12px;font-size:16px;line-height:1.5}
.tip .lbl{display:inline-block;margin-bottom:6px}
.tip b{font-weight:600}
.tip b.gain{font-family:var(--mono);font-weight:500;color:var(--acc)}
.tip .tiprule{margin:12px 0 0;font-size:13px;color:var(--dim)}
.c[data-roll]::after{content:attr(data-roll);position:absolute;right:3px;bottom:2px;font:500 10px/1 var(--mono);color:var(--on-acc)}
.seg button{min-width:40px;width:auto;padding:0 8px}
.crate{position:relative}
.dropper{position:absolute;left:50%;top:-44px;margin-left:-16px;animation:fall .26s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(42px);opacity:.2}}
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer;overflow:hidden}
#intro::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.in-stage{position:relative;width:290px;height:144px}
.in-sleeve{position:absolute;left:0;top:0;z-index:2;animation:inSleeve .5s steps(5) both}
.in-rec{position:absolute;left:8px;top:8px;z-index:1;animation:inRec .7s steps(7) .45s both}
@keyframes inSleeve{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes inRec{from{transform:translateX(0)}to{transform:translateX(146px)}}
.in-logo{font:700 clamp(34px,11vw,56px)/1 var(--sans);letter-spacing:.14em}
.in-logo b{color:var(--acc)}
.in-logo span{display:inline-block;animation:inPop .24s steps(3) both;animation-delay:calc(1.05s + var(--i) * 60ms)}
@keyframes inPop{from{opacity:0;transform:translateY(-12px) scale(1.5)}to{opacity:1;transform:none}}
.in-meta{font:400 13px/1 var(--mono);color:var(--muted);animation:inFade .3s 1.75s both}
.in-go{font:600 13px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--line2);border-radius:var(--r);animation:inFade .3s 2s both,blink 1.1s steps(1) 2.4s infinite}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.3}}
#intro.out{animation:inOut .4s steps(6) forwards}
@keyframes inOut{to{transform:translateY(-100%)}}
@media (prefers-reduced-motion:reduce){.dig img:last-child,.rec.spinning,.spr.loop,.dropper,#intro *,#intro.out{animation:none!important}}
@media (max-width:560px){.readout .crate > img{width:108px;height:48px}.tierstamp{font-size:18px}}

/* ---------- pixel pass ---------- */
.btn.go.on,.btn.go.on:hover:not(:disabled){background:var(--panel2);color:var(--acc);--bc:var(--acc)}
h1{font:700 32px/1.1 var(--pixel);letter-spacing:.01em;text-transform:uppercase;margin:6px 0 6px}
h2{font:700 24px/1.15 var(--pixel);letter-spacing:.01em}
.brand,.brand b{font-family:var(--pixel);font-weight:700;letter-spacing:.06em;font-size:14px}
.tierstamp{font-family:var(--pixel);letter-spacing:.06em}
.btn.go{font-family:var(--pixel);font-weight:700;letter-spacing:.06em}
/* stepped pixel borders: a 3px outline with the corners knocked out */
.btn,.chip,.budget,.seg,.played,.carts>button,.tip,.card,.arch button,.ov,#rollpick,.in-go{
  border:0!important;border-radius:0!important;--bc:var(--line2);
  box-shadow:0 -3px 0 0 var(--bc),0 3px 0 0 var(--bc),-3px 0 0 0 var(--bc),3px 0 0 0 var(--bc);margin:3px}
.btn:hover:not(:disabled){--bc:var(--muted)}
.btn.go{--bc:var(--acc);box-shadow:0 -3px 0 0 var(--bc),0 3px 0 0 var(--bc),-3px 0 0 0 var(--bc),3px 0 0 0 var(--bc),inset 0 -4px 0 0 rgba(0,0,0,.25)}
.btn.go:hover:not(:disabled){--bc:var(--acc-hi)}
.btn.go:active:not(:disabled){transform:translateY(2px);box-shadow:0 -3px 0 0 var(--bc),0 3px 0 0 var(--bc),-3px 0 0 0 var(--bc),3px 0 0 0 var(--bc)}
.btn.on,.chip.ok{--bc:var(--acc)}
.chip.blind{--bc:var(--t-promo)}
.budget.spent,.played,.carts .drop{--bc:var(--acc-lo)}
.card{--bc:var(--line2);padding-top:0}
.tip{--bc:var(--acc);padding:16px 18px;margin:28px 3px 3px}
.toolbar,.chips{gap:12px}
.c{border-radius:0}
.c.on{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.c.on.ph{box-shadow:inset 0 0 0 2px #efe8dacc}
/* rolled hats: the cell splits into 2, 3 or 4 hits */
.c.on.roll2{background:linear-gradient(90deg,var(--acc) 0 44%,#141210 44% 56%,var(--acc) 56%)}
.c.on.roll3{background:linear-gradient(90deg,var(--acc) 0 28%,#141210 28% 36%,var(--acc) 36% 64%,#141210 64% 72%,var(--acc) 72%)}
.c.on.roll4{background:linear-gradient(90deg,var(--acc) 0 20%,#141210 20% 27%,var(--acc) 27% 47%,#141210 47% 54%,var(--acc) 54% 74%,#141210 74% 80%,var(--acc) 80%)}
#rollpick{position:fixed;z-index:20;display:flex;align-items:center;gap:0;background:var(--panel2);--bc:var(--acc);padding:4px}
#rollpick .lbl{padding:0 8px}
#rollpick button{min-width:44px;height:44px;font:500 15px/1 var(--mono);color:var(--text)}
#rollpick button.on{background:var(--acc);color:var(--on-acc)}
#rollpick button:hover:not(.on){background:var(--panel)}
/* start screen */
.scene{border-bottom:3px solid var(--line2);margin:0 0 22px}
.metaline{font:400 13px/1.5 var(--mono);color:var(--muted);margin:0 0 22px}
.twist{font-family:var(--pixel);font-size:11px}
.carts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 24px}
.carts>button{position:relative;cursor:pointer;color:inherit;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 6px 12px;background:var(--panel)}
.carts b{font:700 12px/1.2 var(--pixel);letter-spacing:.02em;text-transform:uppercase;text-align:center}
.carts .x2{margin-left:4px;vertical-align:1px}
.howpix{display:flex;justify-content:space-between;gap:8px;margin:0 0 26px;padding:12px 4px;border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2)}
.howpix .hp{display:flex;align-items:center;gap:8px}
.howpix .hp b{font:500 18px/1 var(--mono)}
.howpix .hp small{display:block;font:600 10px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.howpix .hp span{display:flex;flex-direction:column}
.howpix .dead img{opacity:.35}
.howpix .dead b{color:var(--dim)} .howpix .bside b{color:var(--t-bside)} .howpix .test b{color:var(--t-test)} .howpix .fresh b{color:var(--t-fresh)} .howpix .grail b{color:var(--t-grail)}
.howpix.sm{border:0;padding:0;margin:0;gap:12px;justify-content:flex-start;flex-wrap:wrap}
.howpix.sm .hp b{font-size:14px}
.links{align-items:center}
/* rounds: the stage */
.stage{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--line2)}
.booth{border:0;margin:0;padding:0;gap:14px}
/* results: the swap, drawn on the grid */
.swapgrid{display:grid;grid-template-columns:34px repeat(16,1fr);gap:2px;margin:6px 0 8px}
.swapgrid .sl{font:600 9px/12px var(--sans);color:var(--dim);letter-spacing:.04em}
.swapgrid i{height:12px;background:#221f1b;position:relative}
.swapgrid i.from{outline:2px dashed var(--muted);outline-offset:-1px;opacity:.75}
.swapgrid i.to{background:var(--acc)!important;animation:pulse 1s ease-in-out infinite}
.swapgrid i.gr{outline:2px solid var(--t-grail);outline-offset:-2px}
@keyframes pulse{50%{opacity:.35}}
.swapkey{font:400 12px/1.6 var(--mono)!important;color:var(--muted);margin:0 0 14px!important;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.mdmain .mdd{font-size:15px;color:var(--text)}

.mdmain .mdvs{font-size:13px;color:var(--t-promo)}
.mdmain .mdgo{display:flex;align-items:center;gap:8px;margin-top:4px;font:700 13px/1 var(--pixel);text-transform:uppercase;color:var(--t-fresh)}
.modeday .textbtn{display:block;margin:10px auto 0}
.arch .mine.md{background:#0f1f1a!important}

.mdmain:disabled{opacity:.6;cursor:default;transform:none} .mdused{text-align:center;margin:10px 0 0}
.soundline + .guestline{margin-top:0}
.testerbtn{width:100%;margin:0 0 16px;border-color:var(--t-promo)!important;color:var(--t-promo)}
.tdays{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.tday{background:var(--panel);border:1px solid var(--line);padding:12px 14px}
.tday.today{border-color:var(--acc)}

.tday .th b{font:700 12px/1.2 var(--pixel);text-transform:uppercase} .tday .th span{font:400 12px/1.3 var(--mono);color:var(--muted)}

.tday p i{position:absolute;left:0;top:5px;width:8px;height:8px} .ts{background:var(--t-promo)} .tg{background:var(--t-fresh)} .tm{background:var(--acc)}

.judgebtn{width:100%;margin:14px 0 4px}

.jrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 0;flex-wrap:wrap}
.jrow span{font:600 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.jbtns{display:flex;gap:6px} .jb{width:44px;height:44px;border:1px solid var(--line2);background:var(--panel);font:500 16px/1 var(--mono)}

:root[data-theme=night]{ --bg:#0c0f16; --panel:#131826; --panel2:#1a2133; --line:#232c42; --line2:#2e3954; --acc:#6c8cff; --acc-hi:#8fa8ff; --acc-lo:#26335c; --acc-bg:#121a30; }
:root[data-theme=tape]{ --bg:#1b1712; --panel:#241f18; --panel2:#2c261d; --acc:#d9a441; --acc-hi:#f0bd5a; --acc-lo:#5a4218; --acc-bg:#2a2112; --text:#f3e9d2; }
:root[data-theme=neon]{ --bg:#0d0a14; --panel:#16101f; --panel2:#1e1529; --line:#2c2140; --acc:#ff3fb4; --acc-hi:#ff73c9; --acc-lo:#5c1745; --acc-bg:#241026; }
.g-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 8px}

.g-tile:hover{border-color:var(--line2)}
.g-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.g-tile b{font-size:22px;line-height:1.1}.g-tile b small{font-size:12px;color:var(--muted);margin-left:4px;font-weight:500}

.g-s{font-size:12px;color:var(--muted)}.g-s i{font-style:normal;margin-left:4px}

.g-sponsor{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px;color:var(--muted)}

.g-club{border-color:#f2c230 !important;color:#f2c230 !important}

.g-mile b{font-size:26px;color:var(--acc)}.g-mile span{color:var(--muted)}
.g-share{margin-top:18px}
.g-clip{margin:6px 0}.g-canvas{width:100%;max-width:270px;border-radius:12px;border:1px solid var(--line);display:block}
.g-ad{border:1px dashed var(--line2);border-radius:10px;min-height:90px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;margin:18px 0 6px;padding:10px;text-align:center;color:var(--dim);font-size:13px}

.g-metrics{margin:16px 0}.g-metrics summary{cursor:pointer;color:var(--muted)}
.g-tiers{display:flex;gap:4px;margin:10px 0}.g-tiers span{flex:1;text-align:center;font-size:11px;padding:6px 2px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}

.g-table{list-style:none;padding:0;margin:10px 0}

.g-table li span{color:var(--muted)}.g-table li i{font-style:normal;font-variant-numeric:tabular-nums}

.g-badge{font-style:normal;color:#f2c230}
.g-promise{border:1px solid var(--t-fresh);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.g-perks{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-perks li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.g-perks span{font-size:12px;color:var(--muted)}
@media (max-width:560px){.g-perks{grid-template-columns:1fr}}
.g-prices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.g-price{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px 10px;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.g-price b{font-size:18px}.g-price span{font-size:12px;color:var(--muted)}
.g-price.best{border-color:#f2c230}.g-price em{position:absolute;top:-10px;background:#f2c230;color:#1a1300;font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.g-archlock{opacity:.6}
.g-sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}

.g-legal{max-height:70vh;overflow:auto;font-size:14px;line-height:1.5}.g-legal p{margin:0 0 10px}

<script>

// The digger: two frames — pulling a record up, then reaching back into the crate.
const DIGGER = [
  ["................", "................", ".....hhhhh......", "....hhhhhhh.....", "...chssssshc....", "...cssesessc....", "....sssssss.....", ".....sssss......",
   "....ooooooo.vvv.", "...ooooooooovyv.", "...oooooooo..vv.", "...oooooooo.....", "...oooooooo.....", "....ddd.ddd.....", "....ddd.ddd.....", "....ww...ww....."],
  ["................", "................", "................", ".....hhhhh......", "....hhhhhhh.....", "...chssssshc....", "...cssesessc....", "....sssssss.....",

    const i = x - 2;

    <path d="M${fx(r0)},${fx(s0)} A${R},${R} 0 0 1 ${fx(x1)},${fx(y1)}" fill="none" stroke="var(--t-grail)" stroke-width="6"/>
    ${ticks}<text x="160" y="126" text-anchor="middle" font-family="Archivo Narrow,Arial Narrow,sans-serif" font-weight="700" font-size="11" letter-spacing="2.4" fill="${ink}">CRATE WEIGHT</text>

/* ---------- the weigh-in state machine: intro → per lane (surge?) → lane → notes → subtotal → final ---------- */
function setNeedle(w) { const el = document.getElementById("needle"); if (el) el.style.transform = `rotate(${-90 + 180 * Math.min(1, w / CONFIG.SCALE_MAX)}deg)`; }
let shown = 0;
function setReadout(w) {
  const el = document.getElementById("wt"); if (!el) return;
  const from = shown, t0 = performance.now(); shown = w;
  const step = now => { const k = Math.min(1, (now - t0) / 220); el.textContent = (from + (w - from) * k).toFixed(1); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function weighSteps(R) {
  const steps = [{ t: "intro" }];
  for (const L of lanesOf(S.pz)) {
    const lane = R.lanes.find(l => l.lane === L.id);
    if (L.mult > 1) steps.push({ t: "surge", L });
    steps.push({ t: "lane", L });
    lane.notes.forEach(n => steps.push({ t: "note", L, n }));
    steps.push({ t: "sub", L, lane });
  }
  steps.push({ t: "final" });
  return steps;
}
function crowdGlow() {      // after the weigh-in: shade the empty cells by how many players used them
  for (const L of lanesOf(S.pz)) {
    const lane = S.pz.L[L.id], max = Math.max(1e-9, ...[...lane.valid].map(t => shareOf(S.pz, L.id, t)));
    document.querySelectorAll(`#st-${L.id} i:not(.hit)`).forEach(el => {
      const t = tok(L.id, +el.dataset.s, +el.dataset.r);
      if (lane.valid.has(t)) { el.classList.add("heat"); el.style.setProperty("--a", (0.15 + 0.85 * shareOf(S.pz, L.id, t) / max).toFixed(2)); }
    });
  }
}
async function runWeighIn() {
  const id = ++S.reveal, R = S.result, D = CONFIG.REVEAL;
  let running = 0, banked = 0; shown = 0; S.weighLog = []; S.sleeves = [];
  audioInit();
  for (const st of weighSteps(R)) {
    if (id !== S.reveal) return;
    const fast = S.fast, now = ctx.currentTime + 0.01, wait = ms => sleep(fast ? 0 : ms);
    S.weighLog.push(st.t);
    if (st.t === "intro") await wait(400);
    else if (st.t === "surge") {
      if (!fast) SFX.riser(now, D.SURGE_MS / 1000);
      document.getElementById("x2").classList.add("flash");
      setNeedle(banked + CONFIG.SCALE_MAX * 0.15); await wait(D.SURGE_MS * 0.6);
      setNeedle(banked); await wait(D.SURGE_MS * 0.4);
    } else if (st.t === "lane") {
      document.getElementById(`row-${st.L.id}`).classList.add("live"); await wait(D.LANE_MS);
    } else if (st.t === "note") {
      const n = st.n, el = document.querySelector(`#st-${st.L.id} i[data-s="${n.step}"][data-r="${n.row}"]`);
      if (el) { el.className = `${n.tier} hit`; el.dataset.w = n.w ? "+" + (n.w % 1 ? n.w.toFixed(1) : n.w) : "0"; el.title = `${stampLabel(st.L, n)} · ${n.tierName} · ${fmtPct(n.share)} of players · ${n.w.toFixed(1)}`; }
      running += n.w; setNeedle(running); setReadout(running);
      S.sleeves.push(n.tier); const cr = document.getElementById("crate");
      if (cr) { cr.innerHTML = crateImg(S.sleeves); if (!fast) { const d = document.createElement("span"); d.className = "dropper"; d.innerHTML = recordImg(n.tier, 2); cr.appendChild(d); setTimeout(() => d.remove(), 300); } }
      if (!fast) SFX.thunk(now, Math.min(12, n.w));
      await wait(D.NOTE_MS);
    } else if (st.t === "sub") {
      const lane = st.lane, row = document.getElementById(`row-${st.L.id}`);
      banked += lane.total; running = banked;
      document.getElementById(`sub-${st.L.id}`).innerHTML = `${lane.total.toFixed(1)}${lane.problems.length ? "<small>invalid</small>" : lane.mud.length ? "<small>mud ×0.5</small>" : lane.mult > 1 ? "<small>doubled</small>" : ""}`;
      if (lane.problems.length) row.insertAdjacentHTML("beforeend", `<div class="wnote bad">Invalid: ${lane.problems.join("; ")} — lane scores 0.</div>`);
      else lane.mud.forEach(t => row.insertAdjacentHTML("beforeend", `<div class="wnote">${t} — lane capped at 50%.</div>`));
      row.classList.remove("live"); row.classList.add("done");
      setNeedle(running); setReadout(running);
      if (!fast) SFX.stamp(now);
      await wait(D.SUB_MS);
    } else if (st.t === "final") {
      setNeedle(R.total); setReadout(R.total); crowdGlow();
      SFX.subdrop(now);
      document.getElementById("skip").style.display = "none";
      document.querySelectorAll(".final").forEach(f => f.classList.add("show"));
      await sleep(D.FINAL_MS);
    }
  }
  S.weighDone = true;
}

/* ---------- "heavier next time": the one swap that would have added the most weight ---------- */
function bestSwap(pz, beat, res) {
  let best = null;
  for (const L of lanesOf(pz)) {
    const lane = pz.L[L.id], cur = beat[L.id];
    cur.forEach((n, i) => {
      for (const t of lane.valid) {
        if (t === lane.grail) continue;
        const [, st, row] = t.split(":").map(Number);
        if (st === n.step && row === n.row) continue;
        if (cur.some((m, j) => j !== i && m.step === st && (L.mono || m.row === row))) continue;
        const nb = Object.assign({}, beat, { [L.id]: cur.map((m, j) => (j === i ? { step: st, row } : m)) });
        const r = scoreRun(pz, nb), gain = r1(r.total - res.total);
        if (gain > 0 && (!best || gain > best.gain)) {
          const fromN = res.lanes.find(l => l.lane === L.id).notes.find(x => x.step === n.step && x.row === n.row);
          const toN = r.lanes.find(l => l.lane === L.id).notes.find(x => x.step === st && x.row === row);
          best = { lane: L.id, from: n, to: { step: st, row }, gain, beat: nb, fromTier: fromN.tierName, fromW: fromN.w, toTier: toN.tierName, toW: toN.w };
        }
      }
    });
  }
  return best;
}
function vSwapGrid(w) {

    const n = lane.notes.find(x => x.step === st && x.row === r.row);
    const from = st === w.from.step && r.row === w.from.row, to = st === w.to.step && r.row === w.to.row, grail = !lane.grail.found && st === g[1] && r.row === g[2];
    return `<i class="${n ? n.tier : ""} ${from ? "from" : ""} ${to ? "to" : ""} ${grail ? "gr" : ""}"></i>`;
  }).join("")).join("");
  return `<div class="swapgrid" role="img" aria-label="Your ${L.name} notes coloured by weight; move the outlined note to the flashing cell">${rows}</div>
    <p class="swapkey"><span class="k-from"></span>move this <span class="k-to"></span>to here${lane.grail.found ? "" : ` <span class="k-gr"></span>Grail`}</p>`;
}
function vLadder(total) {     // the crate tiers as a bar: where you landed, and what the next tier needs
  const T = CONFIG.CRATE_TIERS, max = CONFIG.SCALE_MAX, next = T.find(([m]) => m > total);
  const segs = T.map(([min, name], i) => { const end = i < T.length - 1 ? T[i + 1][0] : max; return `<i class="${tierIdOfName(name)}" style="width:${((end - min) / max * 100).toFixed(2)}%"></i>`; }).join("");
  return `<div class="ladder"><div class="lbar">${segs}<span class="you" style="left:${(Math.min(total, max) / max * 100).toFixed(2)}%"></span></div>
    <p class="lnext">${next ? `Next tier: <b>${next[1]}</b> at ${next[0]} — <b>${(next[0] - total).toFixed(1)}</b> to go.` : "Top tier. Nothing heavier exists today."}</p></div>`;

function vBreakdown(R) {     // a price list: each tier's record, what one note there weighs, and a block per note you put there
  const order = ["misfit", "dead", "bside", "white", "fresh", "promo", "test", "grail"], g = {};

function openMode(d) {        // your Mode of the day crate for any day

  S.swap = bestSwap(S.pz, S.beat, S.result);

}

/* ---------- streaks: one free freeze a week (Crate Club holds one more); a freeze covers a missed day ---------- */
const STREAK_KEY = "beatrarity:v2:streak";
const freezeCap = () => (isClub() ? 3 : 2);
function streakState() {
  const s = Object.assign({ last: 0, count: 0, best: 0, freezes: 1, fweek: 0, used: [] }, store.get(STREAK_KEY) || {});
  const wk = Math.floor(TODAY / 7);
  if (s.fweek !== wk) { s.freezes = Math.min(freezeCap(), (s.fweek ? s.freezes : 0) + 1); s.fweek = wk; store.set(STREAK_KEY, s); }   // a new freeze every week
  return s;
}
function streakNow() {
  const s = streakState(), gap = TODAY - s.last - 1;
  if (!s.last) return 0;
  return gap <= 0 || gap <= s.freezes ? s.count : 0;     // alive if played yesterday/today, or freezes cover the gap
}
function bumpStreak() {
  const s = streakState();
  if (s.last === TODAY) return s.count;
  const gap = TODAY - s.last - 1;
  if (s.last && gap > 0 && gap <= s.freezes) {             // freezes kept it alive
    s.freezes -= gap; for (let i = 1; i <= gap; i++) s.used.push(s.last + i);
    s.count += 1; S.freezeUsed = gap; track("freeze_used", { n: gap });
  } else s.count = s.last && gap <= 0 ? s.count + 1 : 1;
  s.last = TODAY; s.best = Math.max(s.best || 0, s.count); store.set(STREAK_KEY, s); netPushStreak();

}
function nextPuzzleIn() {
  const now = new Date(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
  const s = Math.max(0, Math.floor((mid - now) / 1000));
  return `${Math.floor(s / 3600)}h ${pad2(Math.floor(s / 60) % 60)}m`;
}

/* ---------- your history, from saved crates ---------- */
function runHistory() {
  const out = [];

/* ---------- weekly league: 30 players, Bronze → Diamond; top 7 go up, bottom 5 go down ---------- */
const LEAGUES = [["bronze", "Bronze", "#b07a4a"], ["silver", "Silver", "#b9b9c2"], ["gold", "Gold", "#f2c230"], ["plat", "Platinum", "#5fd3b0"], ["diamond", "Diamond", "#7fb3ff"]];
const UP = 7, DOWN = 5;
const weekStart = () => TODAY - ((new Date().getUTCDay() + 6) % 7);    // Monday's puzzle number (UTC, like the server)
const BOT_NAMES = ["lofi.lu", "808mafia", "kxng_keys", "tapehiss", "miro beats", "snarelord", "dusty.fingers", "nova", "jules.wav", "bassface", "OKAYpluck",
  "rhodes_scholar", "hatroll", "cratedigger9", "mpc_mo", "sidechain sal", "velvetkick", "sub.zero", "glitchgoblin", "chopshop", "lazyloops", "kalimbakid",
  "trapdoor", "swingset", "the_quantizer", "minorkey", "bpm_bandit", "grailhunter", "vinyl.vic", "padthai", "stemcell", "afterbeat"];
function gRng(seed) { let x = seed >>> 0 || 1; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); }
function leagueRows(week, tier, from) {      // from: the day you joined this league (rivals only count from then too)
  from = Math.max(week, from || week);
  const me = runHistory().filter(h => h.d >= week && h.d < week + 7 && h.d <= TODAY).reduce((a, h) => a + h.total, 0);
  const rows = [{ name: "You", me: true, pts: me }];
  const r = gRng(week * 97 + tier * 13 + 7);
  const names = BOT_NAMES.slice().sort(() => r() - 0.5).slice(0, 29);
  for (const name of names) {
    const skill = 10 + r() * 22 + tier * 5, play = 0.35 + r() * 0.5, modeP = 0.15 + r() * 0.35; let pts = 0;   // tuned so a daily player lands mid-table in Bronze
    for (let d = from; d < week + 7 && d <= TODAY; d++) {
      const rd = gRng(week * 7919 + name.length * 31 + d * 101 + tier);
      if (rd() < play) pts += Math.max(0, skill + (rd() - 0.5) * 30);
      if (rd() < modeP) pts += Math.max(0, skill * 0.8 + (rd() - 0.5) * 24);
      if (d === TODAY) pts *= 0.4 + 0.6 * ((Date.now() / 86400000) % 1);   // today's points come in through the day
    }
    rows.push({ name, pts: Math.round(pts * 10) / 10 });
  }
  return rows.sort((a, b) => b.pts - a.pts || (a.me ? -1 : 1));
}
function leagueState() {
  const wk = weekStart();
  let L = store.get(LEAGUE_KEY) || { week: wk, tier: 0, last: null, joined: TODAY };
  if (L.week < wk) {                          // the week closed: promote / demote from the final table
    const rows = leagueRows(L.week, L.tier, L.joined), rank = rows.findIndex(x => x.me) + 1, played = rows.find(x => x.me).pts > 0;
    let tier = L.tier, moved = "stayed";
    if (played && rank <= UP && tier < LEAGUES.length - 1) { tier++; moved = "up"; }

    L = { week: wk, tier, last: { rank, moved, from: L.tier }, joined: wk }; store.set(LEAGUE_KEY, L);
  } else if (!store.get(LEAGUE_KEY)) store.set(LEAGUE_KEY, L);
  return L;
}

/* the league as the screens see it: the real one when online, the simulated preview when offline */
function leagueView() {
  const loc = store.get(LEAGUE_KEY) || {};

      if (data && data.league) { const L = store.get(LEAGUE_KEY) || {}; if (data.league.moved) L.last = { moved: data.league.moved, rank: data.league.last_rank }; L.tier = data.league.tier; L.week = data.league.week; store.set(LEAGUE_KEY, L); }
      const k = r.game === "mode" ? modeKey(r.day) : cardKey(r.day), c = store.get(k);
      if (c && data) { c.server = { total: data.total, tier: data.tier }; store.set(k, c); }
    } catch (e) { keep.push(r); }
  }
  store.set(OUTBOX_KEY, keep);
  await netLeague(); await netPools();
}
/* Crate Club membership (read-only for players; the Stripe webhook writes it) */
async function netMembership() {
  if (!NET.online) return;
  const { data } = await NET.sb.from("memberships").select("status, plan, current_period_end").eq("user_id", NET.user.id).maybeSingle();
  const was = isClub(), c = Object.assign({}, store.get(CLUB_KEY) || {}, { status: data ? data.status : "none", plan: data && data.plan, until: data && data.current_period_end });
  store.set(CLUB_KEY, c); applyTheme();
  if (was !== isClub()) { const s = streakState(); s.freezes = Math.min(freezeCap(), s.freezes); store.set(STREAK_KEY, s); }
}
/* back from Stripe Checkout (?club=thanks): the webhook can take a few seconds, so check a few times */
async function netCheckoutReturn() {
  const q = new URLSearchParams(location.search); if (q.get("club") !== "thanks") return;
  try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
  for (let i = 0; i < 15 && !isClub(); i++) { await sleep(3000); await netMembership(); }
  if (isClub()) { track("club_join"); const s = streakState(); s.freezes = Math.min(freezeCap(), s.freezes + 1); store.set(STREAK_KEY, s); toast("Welcome to Crate Club ★ — every perk is on."); S.screen = "club"; render(); }
  else toast("Payment received? It can take a minute to show — reopen the game shortly.");
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.classList.add("bye"), 6000); setTimeout(() => t.remove(), 6500);
}

/* events: batched, no personal data beyond the anonymous account id */
function netQueue(e, d, extra) { if (!TESTER) NET.queue.push({ e, d, extra: extra || null }); }
async function netFlushEvents() {
  if (!NET.online || !NET.queue.length) return;
  const batch = NET.queue.splice(0, 50);
  const { error } = await NET.sb.from("events").insert(batch.map(x => ({ e: x.e, d: x.d, extra: x.extra })));
  if (error) NET.queue.unshift(...batch.slice(0, 200));
}
/* after signing in on another device: bring your crates here */
async function netAfterSignIn() {
  await netProfile();
  const { data } = await NET.sb.from("runs").select("day, game, beat").gte("day", TODAY - 400);
  for (const r of data || []) {
    const k = r.game === "mode" ? modeKey(r.day) : cardKey(r.day);
    if (store.get(k)) continue;
    const pz = r.game === "mode" ? modePuzzle(r.day) : dayPuzzle(r.day);
    try { store.set(k, { result: scoreRun(pz, r.beat), beat: r.beat, synced: true }); } catch (e) {}
  }
  await netLeague(); if (["start", "stats", "league", "archive"].includes(S.screen)) render();
}
function vAccount() {
  if (!NET.online) return `<p class="sechead">Account</p><p class="fine">Offline — your progress is saved on this device and syncs when you're back online.</p>`;
  const anon = NET.user.is_anonymous, h = NET.profile && NET.profile.handle;
  return `<p class="sechead">Account</p>
  <div class="g-acct">
    <div class="g-row"><span>League name: <b>${esc(h || "…")}</b></span><input id="ghandle" maxlength="20" placeholder="new name" autocomplete="off" spellcheck="false"><button class="btn" data-act="gHandle">Change</button></div>
    ${anon ? `<p class="fine">Save your streak and crates so you can play on any device — no password, we email you a link.</p>
      <div class="g-row"><input id="gemail" type="email" placeholder="you@email.com" autocomplete="email"><button class="btn go" data-act="gLink">Save my progress</button></div>

    <span class="fine" id="gacct"></span>

  </div>`;
}
Object.assign(ACT, {
  async gHandle() {
    const el = document.getElementById("ghandle"), say = t => { const m = document.getElementById("gacct"); if (m) m.textContent = t; };
    const h = (el && el.value || "").trim().toLowerCase();
    if (!handleOk(h)) return say("3–20 letters, numbers, dots, dashes or underscores — and keep it friendly.");
    const { error } = await NET.sb.from("profiles").update({ handle: h }).eq("id", NET.user.id);
    if (error) return say(/duplicate|unique/i.test(error.message) ? "That name's taken." : "Couldn't change it — try again.");
    NET.profile.handle = h; track("rename"); render();
  },
  async gLink() {
    const email = (document.getElementById("gemail") || {}).value || "", say = t => { const m = document.getElementById("gacct"); if (m) m.textContent = t; };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say("That email doesn't look right.");
    const { error } = await NET.sb.auth.updateUser({ email }, { emailRedirectTo: location.origin + location.pathname });
    say(error ? (/already/i.test(error.message) ? "That email already has an account — use Sign in instead." : "Couldn't send the link — try again.") : "Check your inbox for a link to confirm."); if (!error) track("email_link");
  },
  async gSignIn() {
    const email = (document.getElementById("gemail") || {}).value || "", say = t => { const m = document.getElementById("gacct"); if (m) m.textContent = t; };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say("Type your email above first.");
    const { error } = await NET.sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
    say(error ? "No saved account with that email." : "Check your inbox for your sign-in link.");
  },
  async gExport() {
    const [p, r, m] = await Promise.all([NET.sb.from("profiles").select("*").eq("id", NET.user.id).maybeSingle(), NET.sb.from("runs").select("day, game, beat, total, tier, created_at"), NET.sb.from("memberships").select("status, plan, current_period_end").maybeSingle()]);
    const data = JSON.stringify({ account: { id: NET.user.id, email: NET.user.email || null }, profile: p.data, runs: r.data, membership: m.data, this_device: { streak: store.get(STREAK_KEY), events: store.get(EVENTS_KEY) } }, null, 2);
    await saveFiles("beat-rarity-my-data", [{ name: "beat-rarity-my-data.json", data: new TextEncoder().encode(data) }], document.getElementById("gacct"));
  },
  async gDelete(el) {
    const say = t => { const m = document.getElementById("gacct"); if (m) m.textContent = t; };
    if (!el.dataset.armed) { el.dataset.armed = 1; el.textContent = "Tap again to delete everything — this can't be undone"; return; }
    const { data, error } = await NET.sb.functions.invoke("delete-account", { body: {} });
    if (error || !data || !data.ok) { const st = error && error.context && error.context.status; return say(st === 409 ? "Cancel Crate Club first (Manage or cancel), then delete." : "Couldn't delete right now — email us and we'll do it."); }
    try { Object.keys(localStorage).filter(k => k.startsWith("beatrarity")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    await NET.sb.auth.signOut().catch(() => {}); location.reload();
  },
  async gSignOut() { await NET.sb.auth.signOut(); store.set(STREAK_KEY, {}); location.reload(); }
});

/* ---------- intro: a record slides out of its sleeve, the logo stamps in, tap to drop the needle ---------- */
function sleeveRows() {
  return grid(18, 18, (x, y) => {
    if (x === 0 || y === 0 || x === 17 || y === 17) return "O";
    if (Math.hypot(x - 8.5, y - 8.5) < 2.6) return "n";
    if (y === 13 || y === 14) return "c";
    return "o";
  });
}
function intro() {
  const el = document.createElement("div");
  el.id = "intro"; el.setAttribute("role", "button"); el.setAttribute("tabindex", "0"); el.setAttribute("aria-label", "Beat Rarity. Tap to enter.");
  el.innerHTML = `<div class="in-stage" aria-hidden="true"><span class="in-rec">${stripSprite("intro-rec", [0, 1, 2, 3].map(f => recordRows("test", f)), 8, { loop: 320 })}</span>
      <span class="in-sleeve">${pxImg("sleeve", sleeveRows(), 8)}</span></div>
    <div class="in-logo" aria-hidden="true">${[..."BEAT"].map((c, i) => `<span style="--i:${i}">${c}</span>`).join("")}<b>${[..."RARITY"].map((c, i) => `<span style="--i:${i + 4}">${c}</span>`).join("")}</b></div>
    <div class="in-meta">No. ${pad3(S.day)} · ${S.pz.name} · ${S.pz.bpm} BPM</div>
    <span class="in-go">Tap to enter</span>`;
  document.body.appendChild(el);
  let gone = false;
  const enter = () => {
    if (gone) return; gone = true;
    try {                                   // needle drop: crackle, then the day's kick and a sub drop
      audioInit(); const t = ctx.currentTime + 0.02;
      nz(t, "lowpass", 2600, 0.7, 0.3, 0.1, master);
      for (let i = 0; i < 6; i++) nz(t + Math.random() * 0.25, "highpass", 3000, 0.7, 0.004, 0.25, master);
      K.kick(t + 0.28, S.pz.kit); SFX.subdrop(t + 0.28);
    } catch (e) {}
    el.classList.add("out");
    setTimeout(() => el.remove(), 420);
    setTimeout(() => { if (ctx) bakeKit(dayPuzzle(S.day)).then(() => bakeKit(modePuzzle(S.day))).catch(logError); }, 150);   // ready before Start
    setTimeout(() => { if (ctx) Radio.sync(); }, 1300);
    document.removeEventListener("keydown", key);
  };
  const key = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); } };
  el.addEventListener("click", enter); document.addEventListener("keydown", key);
}
