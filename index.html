/* Direction: Panel — Roland TR-808 front panel + a cream VU meter.
   Silkscreen labels in Archivo Narrow (uppercase), every number in Chivo Mono. Tier colours = 808 step keys. */
:root{
  --bg:#141210; --panel:#1d1b18; --panel2:#24221e; --line:#2f2c28; --line2:#3c3833;
  --text:#efe8da; --muted:#a39b8e; --dim:#6f685e;
  --acc:#ee5a24; --acc-hi:#ff7843; --acc-lo:#5c2a16; --acc-bg:#23170f; --on-acc:#140c06; --bad:#e5484d;
  --t-dead:#3b2f27; --t-bside:#8a8378; --t-white:#efe6cf; --t-promo:#f2c230; --t-test:#f08a24; --t-grail:#ee3b24;
  --face:#e9e0cb; --face-ink:#2a2520;
  --mono:"Chivo Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --r:0px; --r-lg:0px;
  --pixel:"Silkscreen","Archivo Narrow",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--text);outline-offset:2px}
a{color:var(--muted)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 72px}
.lbl{font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font:700 15px/1 var(--sans);letter-spacing:.16em}
.brand b{color:var(--acc);font-weight:700}
.meta{font:400 11.5px/1.5 var(--mono);color:var(--muted);text-align:right}
.meta .pr{color:var(--acc)}
.screen{animation:in .16s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.ns,.tierstamp,.final.show{animation:none!important}}
h1{font:700 36px/1.05 var(--sans);letter-spacing:-.005em;margin:8px 0 10px;text-wrap:balance}
h2{font:700 24px/1.15 var(--sans);letter-spacing:.02em;text-transform:uppercase;margin:4px 0}
.sub{color:var(--muted);margin:0 0 18px;max-width:600px}
.fine{color:var(--dim);font-size:14px;margin:10px 0 0}

/* buttons */
.btn{height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2);font:600 13px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px);background:var(--panel)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.go{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.go:hover:not(:disabled){background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.big{width:100%;height:54px;font-size:14px}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.go.on{background:var(--panel2);color:var(--acc)}

/* start */
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin:20px 0}
.specs div{background:var(--panel);padding:12px 14px;min-width:0}
.specs b{display:block;font:500 14px/1.25 var(--mono);margin-top:6px}
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 20px}
.rounds div{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;background:var(--panel)}
.rounds b{display:block;font:700 17px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.03em;margin:6px 0 2px}
.rounds span.n{font:400 12px/1 var(--mono);color:var(--muted)}
.rounds .drop{border-color:var(--acc-lo);background:var(--acc-bg)}
.x2{display:inline-block;font:500 11px/1 var(--mono);color:var(--on-acc);background:var(--acc);border-radius:2px;padding:3px 5px;margin-left:8px;vertical-align:3px}
.how{color:var(--muted);font-size:15px;margin:0 0 22px;max-width:600px}
.how em{color:var(--text);font-style:normal}
.played{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--acc-lo);background:var(--acc-bg);border-radius:var(--r-lg);margin-bottom:12px}
.played b{display:block;font:500 16px/1.3 var(--mono);margin-top:4px;color:var(--acc)}
.streak{color:var(--acc)}
.twist{display:inline-block;margin-left:10px;font:600 11px/1 var(--sans);letter-spacing:.1em;padding:5px 7px;border-radius:2px;border:1px solid var(--t-promo);color:var(--t-promo);vertical-align:8px;text-transform:uppercase}
.links{display:flex;justify-content:center;gap:20px;margin-top:18px;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}

/* round */
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.prog div{border-top:2px solid var(--line2);padding-top:8px;font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden}
.prog .done{border-color:var(--acc-lo);color:var(--muted)}
.prog .cur{border-color:var(--acc);color:var(--text)}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.timer{font:500 30px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer.low{color:var(--acc)}
.ov{display:grid;grid-template-columns:44px repeat(16,1fr);gap:3px 2px;padding:10px;border:1px solid var(--line);border-radius:var(--r-lg);background:#100f0d;margin-bottom:14px}

/* ---------- weigh-in: a meter, a number, a stamp; everything else steps back ---------- */
.res{max-width:560px}
.dialwrap{position:relative;max-width:340px}
.dial{width:100%;display:block}
#needle{transform-box:view-box;transform-origin:160px 170px;transition:transform .42s cubic-bezier(.3,1.35,.5,1)}
.readout{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.readout .w{font:500 76px/.95 var(--mono);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.readout .u{font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.badge2{position:absolute;right:0;top:0;font:500 15px/1 var(--mono);color:var(--on-acc);background:var(--acc);padding:6px 8px;border-radius:2px;opacity:0}

@keyframes flash{0%,23%,46%,69%{opacity:1}11%,34%,57%,80%{opacity:.1}100%{opacity:0}}
.wrows{margin-top:36px}

.wrow:last-child{border-bottom:1px solid var(--line)}
.wrow.live,.wrow.done{opacity:1}
.wrow .wn{font:600 12px/1.3 var(--sans);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}

.wrow .wt{font:500 16px/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums}

.stamps{display:flex;flex-wrap:wrap;gap:3px 12px;min-height:18px}
.ns{font:400 12.5px/1.45 var(--mono);white-space:nowrap;animation:drop .22s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.ns b{font-weight:500}
.ns.dead{color:var(--dim);text-decoration:line-through}
.ns.bside{color:var(--t-bside)}
.ns.white{color:var(--t-white)}
.ns.promo{color:var(--t-promo)}
.ns.test{color:var(--t-test)}
.ns.grail{color:var(--t-grail);font-weight:700}
.wnote{grid-column:2/4;font-size:13px;color:var(--t-promo)}
.wnote.bad{color:var(--bad)}
.key{font:400 11px/1.7 var(--mono);color:var(--dim);margin:12px 0 0}
.key span{white-space:nowrap}
.final{display:none}
.final.show{display:block;animation:in .2s ease-out}
#final{margin-top:22px}
.tierstamp{display:inline-block;font:700 22px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:9px 13px 8px;border:2px solid currentColor;outline:1px solid currentColor;outline-offset:3px;color:var(--acc);transform:rotate(-3deg);margin-left:5px;animation:stamp .18s ease-out}
.tierstamp.grail{color:var(--t-grail)}
@keyframes stamp{from{transform:rotate(-3deg) scale(1.3);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.heavier{font:400 18px/1.4 var(--sans);color:var(--muted);margin:22px 0 0}
.heavier b{font:500 18px/1 var(--mono);color:var(--text)}
.heavier .pr{color:var(--dim);font-size:14px}
.playrow{margin-top:26px}
.grails{margin-top:26px}
.gbtn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.gbtn:last-child{border-bottom:1px solid var(--line)}
.gbtn .gl{font:400 16px/1.3 var(--sans)}
.gbtn .gl small{display:block;font:400 12px/1.5 var(--mono);color:var(--muted)}
.gbtn .gs{font:500 12px/1 var(--mono);color:var(--t-grail);white-space:nowrap}
.gbtn:hover:not(.found) .gl{color:var(--t-white)}
.gbtn.on .gl{color:var(--t-grail)}
.gbtn.found{cursor:default}
.gbtn.found .gs{color:var(--muted)}
.skip{display:block;margin:16px 0 0;font:600 11px/1 var(--sans);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:8px 0}
#final-share{margin-top:56px}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:0 22px 18px;overflow:hidden}
.card .rule{height:6px;margin:0 -22px 18px;background:linear-gradient(90deg,var(--t-grail) 0 25%,var(--t-test) 25% 50%,var(--t-promo) 50% 75%,var(--t-white) 75%)}
.card .ch{display:flex;justify-content:space-between;font:400 11px/1 var(--mono);color:var(--muted)}
.card .ch span:first-child{font:700 12px/1 var(--sans);letter-spacing:.16em;color:var(--text)}
.card .cd{font:500 58px/1 var(--mono);margin-top:22px;letter-spacing:-.045em}
.card .cd small{font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--muted);margin-left:8px}
.card .ct{display:inline-block;margin:16px 0 0 4px;font:700 14px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:6px 9px 5px;border:1.5px solid currentColor;outline:1px solid currentColor;outline-offset:2px;color:var(--acc);transform:rotate(-3deg)}
.card .ct.grail{color:var(--t-grail)}
.card .grid{margin-top:20px;display:grid;grid-template-columns:30px repeat(16,1fr);gap:3px 2px;align-items:center}
.card .grid span{font:400 9px/1 var(--mono);color:var(--dim)}
.card .grid i{height:11px;border-radius:1px;background:#2a2723}
.card .cf{display:flex;justify-content:space-between;margin-top:18px;font:400 10.5px/1 var(--mono);color:var(--muted)}
.card .cf b{color:var(--text);font-weight:500}
i.dead{background:var(--t-dead)!important} i.bside{background:var(--t-bside)!important} i.white{background:var(--t-white)!important}
i.promo{background:var(--t-promo)!important} i.test{background:var(--t-test)!important} i.grail{background:var(--t-grail)!important}
.shareact{display:flex;align-items:center;gap:20px;margin-top:16px;flex-wrap:wrap}
.textbtn{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 0}
.textbtn:hover{color:var(--text)}
details{margin-top:10px}
summary{cursor:pointer;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:10px 0}
textarea{width:100%;height:200px;margin:8px 0;background:#0c0b0a;color:var(--muted);border:1px solid var(--line);border-radius:var(--r);font:12px/1.45 var(--mono);padding:10px;resize:vertical}
textarea:focus{border-color:var(--text);outline:none}
.arch{display:grid;gap:8px}
.arch button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);text-align:left}
.arch button:hover{border-color:var(--muted)}
.arch b{font:700 18px/1.2 var(--sans)}
.arch span{font:400 12px/1.4 var(--mono);color:var(--muted)}
@media (max-width:560px){
  h1{font-size:30px}
  .specs b{font-size:12px}
  .rounds{grid-template-columns:repeat(2,1fr)}
  .ed{grid-template-columns:38px repeat(var(--cols),1fr)}
  .rl{font-size:10px}
  .ov{grid-template-columns:32px repeat(16,1fr);padding:8px}
  .toolbar .go{flex:1 1 100%;margin-left:0;height:52px}
  .readout .w{font-size:68px}
  .wrow{grid-template-columns:64px 1fr 50px}
  .card{max-width:none}
}
/* ---------- pixel sprites ---------- */
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:bottom}
.scene{display:flex;align-items:flex-end;gap:6px;padding-bottom:10px;border-bottom:2px solid var(--line2);margin:4px 0 22px;width:max-content;max-width:100%}
.dig{position:relative;display:inline-block;width:64px;height:64px}
.dig img{position:absolute;inset:0}
.dig img:last-child{animation:dig 1s steps(1,end) infinite}
@keyframes dig{0%{opacity:0}50%{opacity:1}}
.lane-ico{margin-right:12px;vertical-align:-4px}
.rec{display:inline-block;width:var(--sz);height:var(--sz);background-size:calc(var(--sz) * 4) var(--sz);background-repeat:no-repeat;background-position:0 0;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.rec.spinning{animation:spin .44s steps(4) infinite}
@keyframes spin{to{background-position:calc(var(--sz) * -4) 0}}
.tierrow{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.readout .crate{margin-left:auto;align-self:flex-end}
.gbtn{grid-template-columns:auto 1fr auto}
.gbtn .gi{opacity:1}
.gbtn.found .gi{filter:grayscale(1);opacity:.5}
.card .cdrow{display:flex;justify-content:space-between;align-items:flex-end}
.spr{display:inline-block;width:var(--w);height:var(--h);background-repeat:no-repeat;background-size:calc(var(--w) * var(--n)) var(--h);background-position:0 0;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.spr.f1{background-position:calc(var(--w) * -1) 0}
.spr.loop{animation:frames var(--dur) steps(var(--n)) infinite}
@keyframes frames{to{background-position:calc(var(--w) * var(--n) * -1) 0}}
.scene{gap:10px;padding-bottom:12px}
.booth{display:flex;align-items:flex-end;gap:12px;padding:0 0 10px;margin:-4px 0 12px;border-bottom:2px solid var(--line2);width:max-content}
.booth #spk{margin-left:8px}
.seg{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:var(--r);height:44px;overflow:hidden}
.seg .lbl{padding:0 10px 0 12px}
.seg button{width:40px;height:100%;font:500 15px/1 var(--mono);border-left:1px solid var(--line2);color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.c.span::after{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--acc-lo)}
.c.chordn{box-shadow:inset 3px 0 0 var(--acc-hi)}
.goal{margin:6px 0 0;font-size:14px;color:var(--muted)}
.tip{margin-top:26px;padding:2px 0 2px 16px;border-left:2px solid var(--acc)}
.tip p{margin:0 0 12px;font-size:16px;line-height:1.5}
.tip .lbl{display:inline-block;margin-bottom:6px}
.tip b{font-weight:600}
.tip b.gain{font-family:var(--mono);font-weight:500;color:var(--acc)}
.tip .tiprule{margin:12px 0 0;font-size:13px;color:var(--dim)}
.c[data-roll]::after{content:attr(data-roll);position:absolute;right:3px;bottom:2px;font:500 10px/1 var(--mono);color:var(--on-acc)}
.seg button{min-width:40px;width:auto;padding:0 8px}
.crate{position:relative}
.dropper{position:absolute;left:50%;top:-44px;margin-left:-16px;animation:fall .26s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(42px);opacity:.2}}
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer;overflow:hidden}
#intro::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.in-stage{position:relative;width:290px;height:144px}
.in-sleeve{position:absolute;left:0;top:0;z-index:2;animation:inSleeve .5s steps(5) both}
.in-rec{position:absolute;left:8px;top:8px;z-index:1;animation:inRec .7s steps(7) .45s both}
@keyframes inSleeve{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes inRec{from{transform:translateX(0)}to{transform:translateX(146px)}}
.in-logo{font:700 clamp(34px,11vw,56px)/1 var(--sans);letter-spacing:.14em}
.in-logo b{color:var(--acc)}
.in-logo span{display:inline-block;animation:inPop .24s steps(3) both;animation-delay:calc(1.05s + var(--i) * 60ms)}
@keyframes inPop{from{opacity:0;transform:translateY(-12px) scale(1.5)}to{opacity:1;transform:none}}
.in-meta{font:400 13px/1 var(--mono);color:var(--muted);animation:inFade .3s 1.75s both}
.in-go{font:600 13px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--line2);border-radius:var(--r);animation:inFade .3s 2s both,blink 1.1s steps(1) 2.4s infinite}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.3}}
#intro.out{animation:inOut .4s steps(6) forwards}
@keyframes inOut{to{transform:translateY(-100%)}}
@media (prefers-reduced-motion:reduce){.dig img:last-child,.rec.spinning,.spr.loop,.dropper,#intro *,#intro.out{animation:none!important}}
@media (max-width:560px){.readout .crate > img{width:108px;height:48px}.tierstamp{font-size:18px}}

/* ---------- pixel pass ---------- */
.btn.go.on,.btn.go.on:hover:not(:disabled){background:var(--panel2);color:var(--acc);--bc:var(--acc)}
h1{font:700 32px/1.1 var(--pixel);letter-spacing:.01em;text-transform:uppercase;margin:6px 0 6px}
h2{font:700 24px/1.15 var(--pixel);letter-spacing:.01em}
.brand,.brand b{font-family:var(--pixel);font-weight:700;letter-spacing:.06em;font-size:14px}
.tierstamp{font-family:var(--pixel);letter-spacing:.06em}
.btn.go{font-family:var(--pixel);font-weight:700;letter-spacing:.06em}
/* stepped pixel borders: a 3px outline with the corners knocked out */
.btn,.chip,.budget,.seg,.played,.carts>div,.tip,.card,.arch button,.ov,#rollpick,.in-go{
  border:0!important;border-radius:0!important;--bc:var(--line2);
  box-shadow:0 -3px 0 0 var(--bc),0 3px 0 0 var(--bc),-3px 0 0 0 var(--bc),3px 0 0 0 var(--bc);margin:3px}
.btn:hover:not(:disabled){--bc:var(--muted)}
.btn.go{--bc:var(--acc);box-shadow:0 -3px 0 0 var(--bc),0 3px 0 0 var(--bc),-3px 0 0 0 var(--bc),3px 0 0 0 var(--bc),inset 0 -4px 0 0 rgba(0,0,0,.25)}
.btn.go:hover:not(:disabled){--bc:var(--acc-hi)}
.btn.go:active:not(:disabled){transform:translateY(2px);box-shadow:0 -3px 0 0 var(--bc),0 3px 0 0 var(--bc),-3px 0 0 0 var(--bc),3px 0 0 0 var(--bc)}
.btn.on,.chip.ok{--bc:var(--acc)}
.chip.blind{--bc:var(--t-promo)}
.budget.spent,.played,.carts .drop{--bc:var(--acc-lo)}
.card{--bc:var(--line2);padding-top:0}
.tip{--bc:var(--acc);padding:16px 18px;margin:28px 3px 3px}
.toolbar,.chips{gap:12px}
.c{border-radius:0}
.c.on{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.c.on.ph{box-shadow:inset 0 0 0 2px #efe8dacc}
/* rolled hats: the cell splits into 2, 3 or 4 hits */
.c.on.roll2{background:linear-gradient(90deg,var(--acc) 0 44%,#141210 44% 56%,var(--acc) 56%)}
.c.on.roll3{background:linear-gradient(90deg,var(--acc) 0 28%,#141210 28% 36%,var(--acc) 36% 64%,#141210 64% 72%,var(--acc) 72%)}
.c.on.roll4{background:linear-gradient(90deg,var(--acc) 0 20%,#141210 20% 27%,var(--acc) 27% 47%,#141210 47% 54%,var(--acc) 54% 74%,#141210 74% 80%,var(--acc) 80%)}
#rollpick{position:fixed;z-index:20;display:flex;align-items:center;gap:0;background:var(--panel2);--bc:var(--acc);padding:4px}
#rollpick .lbl{padding:0 8px}
#rollpick button{min-width:44px;height:44px;font:500 15px/1 var(--mono);color:var(--text)}
#rollpick button.on{background:var(--acc);color:var(--on-acc)}
#rollpick button:hover:not(.on){background:var(--panel)}
/* start screen */
.scene{border-bottom:3px solid var(--line2);margin:0 0 22px}
.metaline{font:400 13px/1.5 var(--mono);color:var(--muted);margin:0 0 22px}
.twist{font-family:var(--pixel);font-size:11px}

.carts>div{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 6px 12px;background:var(--panel)}
.carts b{font:700 12px/1.2 var(--pixel);letter-spacing:.02em;text-transform:uppercase;text-align:center}
.carts .x2{margin-left:4px;vertical-align:1px}
.howpix{display:flex;justify-content:space-between;gap:8px;margin:0 0 26px;padding:12px 4px;border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2)}
.howpix .hp{display:flex;align-items:center;gap:8px}
.howpix .hp b{font:500 18px/1 var(--mono)}
.howpix .hp small{display:block;font:600 10px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.howpix .hp span{display:flex;flex-direction:column}

.howpix .dead b{color:var(--dim)} .howpix .bside b{color:var(--t-bside)} .howpix .test b{color:var(--t-test)} .howpix .grail b{color:var(--t-grail)}

.links{align-items:center}
/* rounds: the stage */
.stage{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--line2)}
.booth{border:0;margin:0;padding:0;gap:14px}
/* results: the swap, drawn on the grid */
.swapgrid{display:grid;grid-template-columns:34px repeat(16,1fr);gap:2px;margin:6px 0 8px}
.swapgrid .sl{font:600 9px/12px var(--sans);color:var(--dim);letter-spacing:.04em}
.swapgrid i{height:12px;background:#221f1b;position:relative}
.swapgrid i.from{outline:2px dashed var(--muted);outline-offset:-1px;opacity:.75}

.swapgrid i.gr{outline:2px solid var(--t-grail);outline-offset:-2px}
@keyframes pulse{50%{opacity:.35}}
.swapkey{font:400 12px/1.6 var(--mono)!important;color:var(--muted);margin:0 0 14px!important;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.k-from{outline:2px dashed var(--muted);outline-offset:-2px;margin-left:0}
.k-to{background:var(--acc);margin-left:10px}

/* intro: smooth motion */
.in-sleeve{animation:inSleeve .7s cubic-bezier(.2,.8,.2,1) both}
.in-rec{animation:inRec 1s cubic-bezier(.22,.9,.25,1) .45s both}
.in-rec .spr{animation:rot 1.8s linear infinite;background-position:0 0!important}
@keyframes rot{to{transform:rotate(360deg)}}
.in-logo{font-family:var(--pixel)}
.in-logo span{animation:inPop .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(1.05s + var(--i) * 55ms)}
.in-meta{animation:inFade .6s ease 1.7s both}
.in-go{font-family:var(--pixel);animation:inFade .6s ease 2s both,breathe 1.8s ease-in-out 2.6s infinite}
@keyframes breathe{50%{opacity:.45}}
#intro.out{animation:inOut .6s cubic-bezier(.7,0,.3,1) forwards}
@media (max-width:560px){
  h1{font-size:26px}
  .carts{grid-template-columns:repeat(4,1fr);gap:10px}
  .carts b{font-size:10px}
  .howpix .hp small{display:none}
  .howpix .hp b{font-size:15px}
  .swapgrid{grid-template-columns:28px repeat(16,1fr)}
}
@media (prefers-reduced-motion:reduce){.swapgrid i.to,.in-rec .spr{animation:none!important}}

/* ---------- results: pictures, not codes ---------- */
.sechead{font:700 13px/1.3 var(--pixel);letter-spacing:.03em;text-transform:uppercase;margin:0 0 12px}
.sechead small{display:block;font:400 14px/1.45 var(--sans);text-transform:none;letter-spacing:0;color:var(--muted);margin-top:6px}
.wrows{margin-top:40px}
.wrow{grid-template-columns:84px 1fr 52px;align-items:center}
.wrow .wn{display:flex;align-items:center;gap:8px}
.stamps:has(.lgrid){display:block}
.lgrid{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;width:100%}
.lgrid i{height:9px;background:#1e1c19;position:relative}
.lgrid i.placed{box-shadow:inset 0 0 0 1px var(--muted)}
.lgrid i.dead{background:var(--t-dead);box-shadow:inset 0 0 0 1px #6b4a3a}
.lgrid i.bside{background:var(--t-bside)} .lgrid i.white{background:var(--t-white)} .lgrid i.promo{background:var(--t-promo)}
.lgrid i.test{background:var(--t-test)} .lgrid i.grail{background:var(--t-grail);box-shadow:0 0 0 1px var(--t-promo)}
.lgrid i.hit{animation:hitpop .25s ease-out}
.lgrid i.hit::after{content:attr(data-w);position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font:500 10px/1 var(--mono);color:var(--text);white-space:nowrap;pointer-events:none;animation:floatup .9s ease-out forwards;z-index:2}
@keyframes hitpop{from{transform:scale(1.8)}to{transform:none}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-12px)}}
.wrows .howpix{margin-top:14px}
.ladder{margin-top:20px}
.lbar{position:relative;display:flex;height:14px;gap:2px}
.lbar i{display:block;height:100%}
.lbar i.bside{background:var(--t-bside)} .lbar i.white{background:var(--t-white)} .lbar i.promo{background:var(--t-promo)} .lbar i.test{background:var(--t-test)} .lbar i.grail{background:var(--t-grail)}
.lbar .you{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:var(--text);box-shadow:0 0 0 2px var(--bg)}
.lnext{margin:12px 0 0;font-size:15px;color:var(--muted)}
.lnext b{color:var(--text);font-weight:600}
.bd{margin-top:30px}
.bdrow{display:grid;grid-template-columns:auto 128px 1fr 44px;gap:10px;align-items:center;padding:5px 0}
.bdrow .bn{font:600 13px/1.2 var(--sans);letter-spacing:.03em;text-transform:uppercase}
.bdrow .bbar{height:10px;background:#1e1c19}
.bdrow .bbar i{display:block;height:100%}
.bdrow .bw{font:500 14px/1 var(--mono);text-align:right}
.bdrow.dead .bn,.bdrow.dead .bw{color:var(--dim)} .bdrow.dead img{opacity:.35}
.bdrow.bside .bbar i{background:var(--t-bside)} .bdrow.white .bbar i{background:var(--t-white)} .bdrow.promo .bbar i{background:var(--t-promo)}
.bdrow.test .bbar i{background:var(--t-test)} .bdrow.grail .bbar i{background:var(--t-grail)} .bdrow.dead .bbar i{background:var(--t-dead)}
.bdrow.test .bn{color:var(--t-test)} .bdrow.grail .bn{color:var(--t-grail)} .bdrow.promo .bn{color:var(--t-promo)}
@media (max-width:560px){.wrow{grid-template-columns:64px 1fr 44px}.wrow .wn img{display:none}.bdrow{grid-template-columns:auto 104px 1fr 40px}.bdrow .bn{font-size:11px}}
@media (prefers-reduced-motion:reduce){.lgrid i.hit,.lgrid i.hit::after{animation:none}}

/* ---------- listening toggles + "just placed" flash ---------- */
.listenbar{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 0}
.tgl{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 0;min-height:36px}
.tgl i{width:28px;height:14px;background:var(--line2);position:relative;box-shadow:0 0 0 2px var(--line2)}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--muted);transition:left .12s}
.tgl.on{color:var(--text)}
.tgl.on i{background:var(--acc-lo);box-shadow:0 0 0 2px var(--acc)}
.tgl.on i::after{left:16px;background:var(--acc)}
.c.just{animation:justset .6s ease-out}
@keyframes justset{0%{box-shadow:0 0 0 4px var(--text);transform:scale(1.12)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
@media (prefers-reduced-motion:reduce){.c.just{animation:none}}

/* ---------- Start: pixel sweep ---------- */
#pxgo{position:fixed;inset:0;z-index:60;display:grid;grid-auto-rows:44px;pointer-events:none;overflow:hidden}
#pxgo i{display:block;background:var(--acc);transform:scale(0);will-change:transform;animation:pxin var(--dur) cubic-bezier(.3,0,.2,1) var(--d) forwards}
#pxgo.out i{transform:scale(1.06);animation:pxout var(--dur) cubic-bezier(.6,0,.8,1) var(--d) forwards}
#pxgo.full{background:var(--acc)}
#pxgo i.b{background:var(--acc-lo)}
@keyframes pxin{from{transform:scale(0)}to{transform:scale(1.06)}}
@keyframes pxout{from{transform:scale(1.06)}to{transform:scale(0)}}
#pxgo span{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:700 16px/1 var(--pixel);letter-spacing:.06em;text-transform:uppercase;color:var(--on-acc);white-space:nowrap;animation:inFade .2s ease .2s both}
#pxgo.out span{animation:pxlabel .15s ease forwards}
@keyframes pxlabel{to{opacity:0}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--panel2);color:var(--text);font:400 14px/1.4 var(--sans);padding:12px 16px;max-width:calc(100% - 32px);--bc:var(--t-promo);box-shadow:0 -3px 0 0 var(--bc),0 3px 0 0 var(--bc),-3px 0 0 0 var(--bc),3px 0 0 0 var(--bc);animation:inFade .25s ease both;transition:opacity .4s}
.toast b{color:var(--t-promo);font-weight:600}
.toast.bye{opacity:0}

/* ---------- crowd hints ---------- */
.c.crowd:not(.on)::before{content:"";position:absolute;inset:5px;border:2px dotted #8a837880}
.c.crowd:not(.on)::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#8a8378aa}
.crowdkey{display:flex;align-items:center;gap:10px;margin:8px 0 0;font-size:14px;color:var(--muted)}
.crowdkey span{flex:none;width:18px;height:18px;border:2px dotted #8a8378;position:relative}
.crowdkey span::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;background:#8a8378}
.cmbtn{width:100%;margin-top:18px}
.cmlane{margin-top:22px}
.cmname{display:flex;align-items:center;gap:8px;font:700 12px/1 var(--pixel);text-transform:uppercase;margin:0 0 8px}
.cmgrid{display:grid;grid-template-columns:34px repeat(16,1fr);gap:2px}
.cmgrid .sl{font:600 9px/12px var(--sans);color:var(--dim)}
.cmgrid i{height:12px;background:#1a1816;position:relative}
.cmgrid i[style]{opacity:var(--a)}
.cmgrid i.bside{background:var(--t-bside)} .cmgrid i.white{background:var(--t-white)} .cmgrid i.promo{background:var(--t-promo)}
.cmgrid i.test{background:var(--t-test)} .cmgrid i.grail{background:var(--t-grail)}
.cmgrid i.gr{opacity:1!important;box-shadow:inset 0 0 0 2px var(--t-promo)}
.cmgrid i.mine{opacity:1!important;outline:2px solid var(--text);outline-offset:-1px}
@media (max-width:560px){.cmgrid{grid-template-columns:28px repeat(16,1fr)}}

/* ---------- helpers ---------- */
const pad2 = n => String(n).padStart(2, "0");
const pad3 = n => String(n).padStart(3, "0");
const r1 = x => Math.round(x * 10) / 10;
const laneOf = id => LANES.find(l => l.id === id);
const tok = (lane, step, row) => `${lane}:${step}:${row}`;
const scaleOf = pz => SCALES[pz.scale];
const keyLabel = pz => `${NOTES[pz.root]} ${scaleOf(pz).label}`;
const rowSemis = (pz, row) => { const iv = scaleOf(pz).iv, n = iv.length; return iv[row % n] + 12 * Math.floor(row / n); };
const rowPc = (pz, row) => (pz.root + rowSemis(pz, row)) % 12;
const isRootRow = (pz, row) => row % scaleOf(pz).iv.length === 0;
const bassMidi = (pz, row) => 24 + pz.root + (pz.root < 5 ? 12 : 0) + rowSemis(pz, row);
const melMidi = (pz, row) => 60 + pz.root - (pz.root > 6 ? 12 : 0) + rowSemis(pz, row);
const rowName = (L, pz, row) => (L.pitched ? NOTES[rowPc(pz, row)] : L.rows[row]);
const sortNotes = ns => ns.slice().sort((a, b) => a.step - b.step || a.row - b.row);

function parseLaneSeed(laneId, entry) {
  const [count, ...strs] = entry, notes = [];
  if (laneId === "drums") strs.forEach((s, row) => [...s].forEach((c, step) => { if (c === "x") notes.push({ step, row }); }));
  else [...strs[0]].forEach((c, step) => { if (c !== ".") notes.push({ step, row: laneId === "fx" ? "ric".indexOf(c) : +c }); });
  return { count, notes };
}

    const arche = pz.seed[L.id].map(e => parseLaneSeed(L.id, e)), counts = {};
    for (const a of arche) for (const n of a.notes) { const t = tok(L.id, n.step, n.row); counts[t] = (counts[t] || 0) + a.count; }
    const rares = {};
    for (const [k, c] of Object.entries(pz.rares[L.id])) { const t = `${L.id}:${k}`; rares[t] = c; counts[t] = (counts[t] || 0) + c; }
    pz.L[L.id] = { arche, rares, counts, valid: new Set(Object.keys(counts)), grail: `${L.id}:${pz.grail[L.id]}` };
  }
}

/* ---------- daily puzzle ---------- */
function dayNumber(date = new Date()) {
  const launch = Date.parse(CONFIG.LAUNCH_DATE + "T00:00:00Z");
  return Math.floor((Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()) - launch) / 864e5) + 1;
}
const puzzleForDay = n => PUZZLES[(((n - 1) % PUZZLES.length) + PUZZLES.length) % PUZZLES.length];
const dateOfDay = n => new Date(Date.parse(CONFIG.LAUNCH_DATE + "T00:00:00Z") + (n - 1) * 864e5);

/* ---------- pool: faded seed + real scored runs (first run of the day only) ---------- */
const realPool = {};    // puzzleId -> { n, counts: {token: players}, weights: [crate weights] }
const realOf = pz => (realPool[pz.id] ||= { n: 0, counts: {}, weights: [] });
function shareOf(pz, laneId, t) {
  const real = realOf(pz), w = Math.max(0, 1 - real.n / CONFIG.SEED_FADE_SUBMISSIONS);
  const total = CONFIG.SEED_PLAYERS * w + real.n;
  return total ? ((pz.L[laneId].counts[t] || 0) * w + (real.counts[t] || 0)) / total : 0;
}
function addToPool(pz, beat, weight) {
  const real = realOf(pz); real.n++; real.weights.push(weight);
  for (const L of LANES) for (const n of beat[L.id]) { const t = tok(L.id, n.step, n.row); real.counts[t] = (real.counts[t] || 0) + 1; }
}
function tierOf(pz, laneId, t, share) {
  if (!pz.L[laneId].valid.has(t)) return CONFIG.DEAD;
  if (t === pz.L[laneId].grail && share < CONFIG.GRAIL.below) return CONFIG.GRAIL;
  return CONFIG.LADDER.find(x => share > x.above) || CONFIG.LADDER[CONFIG.LADDER.length - 1];
}

/* ---------- gate 1: visible rules (gate submit) + hidden checks (zero the lane) ---------- */
function visibleRules(pz, L, notes) {
  if (L.id === "drums") return [{ label: "Kick on 01", ok: notes.some(n => n.step === 0 && n.row === 0) }];
  if (L.id === "bass") return [{ label: "Root on 01", ok: notes.some(n => n.step === 0 && isRootRow(pz, n.row)) }];
  if (L.id === "mel") return [{ label: "3+ notes", ok: notes.length >= 3 }];
  return [{ label: "1+ FX", ok: notes.length >= 1 }];
}
function hiddenProblems(pz, L, notes) {
  const out = [], ns = sortNotes(notes);
  if (notes.length > L.budget) out.push("over the note budget");
  if (L.id === "drums") for (const [row, nm] of [[0, "kicks"], [1, "snares"]]) {
    let run = 0, max = 0;
    for (let s = 0; s < 16; s++) { run = ns.some(n => n.step === s && n.row === row) ? run + 1 : 0; max = Math.max(max, run); }
    if (max >= 4) out.push(`${max} ${nm} in a row`);
  }
  if (L.pitched) {
    let run = 1;
    for (let i = 1; i < ns.length; i++) { run = ns[i].row === ns[i - 1].row ? run + 1 : 1; if (run >= 4) { out.push("the same note 4+ times in a row (drone)"); break; } }
  }
  return out;
}
/* ---------- fit: a hard clash caps the lane at MUD_CAP ---------- */
function mudOf(pz, L, beat) {
  if (L.id === "drums") {
    const hits = beat.drums.filter(n => n.row === 0 && beat.drums.some(m => m.step === n.step && m.row === 1)).map(n => pad2(n.step + 1));
    return hits.length ? [`Mud: kick and snare fight on step ${hits.join(", ")}`] : [];
  }
  if (L.id === "mel") {
    const n = scaleOf(pz).iv.length;
    const hits = beat.mel.filter(m => beat.bass.some(b => b.step === m.step && b.row % n === m.row % n)).map(m => pad2(m.step + 1));
    return hits.length ? [`Mud: melody doubles the 808's note on step ${hits.join(", ")}`] : [];
  }
  return [];
}

/* ---------- one full run → crate weight ---------- */
function scoreRun(pz, beat) {
  const lanes = LANES.map(L => {
    const notes = sortNotes(beat[L.id]);
    const vis = visibleRules(pz, L, notes);
    const problems = hiddenProblems(pz, L, notes).concat(vis.filter(r => !r.ok).map(r => `rule not met: ${r.label}`));
    const scored = notes.map(n => {
      const t = tok(L.id, n.step, n.row), share = shareOf(pz, L.id, t), tier = tierOf(pz, L.id, t, share);
      return { token: t, step: n.step, row: n.row, share, tier: tier.id, tierName: tier.name, w: tier.w * L.mult };
    });
    const raw = scored.reduce((a, b) => a + b.w, 0), mud = mudOf(pz, L, beat);
    const total = problems.length ? 0 : raw * (mud.length ? CONFIG.MUD_CAP : 1);
    return { lane: L.id, round: L.round, mult: L.mult, notes: scored, raw: r1(raw), mud, problems, total: r1(total),
             grail: { token: pz.L[L.id].grail, found: scored.some(s => s.token === pz.L[L.id].grail) } };
  });
  const total = r1(lanes.reduce((a, b) => a + b.total, 0));
  return { puzzle_id: pz.id, lanes, total, tier: crateTier(total) };

<script>
const PXC = { h: "#3b2a1e", s: "#e0a878", e: "#141210", c: "#efe6cf", o: "#ee5a24", O: "#a83c16", v: "#1b1917", y: "#f2c230", Y: "#b8891a",
  d: "#4a5468", D: "#353c4b", w: "#efe8da", g: "#8a8378", G: "#6f685e", n: "#2b2825", m: "#3c3833", b: "#9a6438", B: "#5c3a20", r: "#ee3b24", k: "#0c0b0a", t: "#f08a24" };

const pxCache = {};
function pxURL(key, rows) {
  if (pxCache[key]) return pxCache[key];
  const h = rows.length, w = rows[0].length, cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const x = cv.getContext("2d");
  rows.forEach((row, yy) => [...row].forEach((ch, xx) => { const col = PXC[ch]; if (col) { x.fillStyle = col; x.fillRect(xx, yy, 1, 1); } }));
  return (pxCache[key] = { url: cv.toDataURL(), w, h });
}
const pxImg = (key, rows, scale, cls = "") => { const s = pxURL(key, rows); return `<img class="px ${cls}" src="${s.url}" width="${s.w * scale}" height="${s.h * scale}" alt="">`; };
function grid(w, h, fn) { const rows = []; for (let y = 0; y < h; y++) { let r = ""; for (let x = 0; x < w; x++) r += fn(x, y) || "."; rows.push(r); } return rows; }

// The digger: two frames — pulling a record up, then reaching back into the crate.
const DIGGER = [
  ["................", "................", ".....hhhhh......", "....hhhhhhh.....", "...chssssshc....", "...cssesessc....", "....sssssss.....", ".....sssss......",
   "....ooooooo.vvv.", "...ooooooooovyv.", "...oooooooo..vv.", "...oooooooo.....", "...oooooooo.....", "....ddd.ddd.....", "....ddd.ddd.....", "....ww...ww....."],
  ["................", "................", "................", ".....hhhhh......", "....hhhhhhh.....", "...chssssshc....", "...cssesessc....", "....sssssss.....",
   "....ooooooo.....", "...ooooooooo....", "...ooooooooos...", "...oooooooo.....", "...oooooooo.....", "....ddd.ddd.....", "....ddd.ddd.....", "....ww...ww....."]
];
// A vinyl record: label colour = tier. Four frames rotate a highlight so it can spin.
function recordRows(tier, frame = 0) {
  const gold = tier === "grail", disc = gold ? "y" : "n", groove = gold ? "Y" : "m", shine = gold ? "w" : "g";
  const fa = frame * Math.PI / 2 + Math.PI / 4;
  return grid(16, 16, (x, y) => {
    const dx = x - 7.5, dy = y - 7.5, d = Math.hypot(dx, dy);
    if (d > 7.8 || d < 0.9) return ".";
    if (d <= 3.1) return gold ? "r" : TIER_CH[tier] || "g";
    let da = Math.abs(Math.atan2(dy, dx) - fa); da = Math.min(da, 2 * Math.PI - da);
    if (d > 3.7 && d < 7.2 && da < 0.22) return shine;
    return (d > 5.0 && d < 5.6) || (d > 6.5 && d < 6.9) ? groove : disc;
  });
}
// A record crate: one sleeve per note, coloured by its tier.
function crateRows(sleeves) {
  return grid(36, 16, (x, y) => {
    const i = x - 2;
    if (y < 6) { if (i < 0 || i >= 32 || i >= sleeves.length) return "."; const top = 5 - (2 + ((i * 7) % 4)); return y > top ? TIER_CH[sleeves[i]] || "g" : "."; }
    if (x === 0 || x === 35 || y === 6 || y === 15) return "B";
    if (y === 9 && x > 12 && x < 23) return "k";
    if (y === 12) return "B";
    return "b";
  });
}
const LANE_ICON = {
  drums: () => grid(12, 12, (x, y) => { const d = Math.hypot(x - 5.5, y - 5.5); return d > 5.8 ? "." : d > 4.6 ? "o" : d > 1.4 ? "c" : "O"; }),
  bass: () => grid(12, 12, (x, y) => { const d = Math.hypot(x - 5.5, y - 5.5); return d > 5.8 ? "." : d > 4.8 ? "m" : d > 2.6 ? "g" : d > 1.4 ? "m" : "o"; }),
  mel: () => grid(12, 10, (x, y) => { if (y === 0 || y === 9 || x === 0 || x === 11) return "B"; const black = y < 6 && [2, 3, 5, 6, 8, 9].includes(x) && x % 3 !== 1; return black ? "v" : x % 3 === 1 && y > 0 ? "m" : "c"; }),
  fx: () => ["......yyy...", ".....yyy....", "....yyy.....", "...yyyyyyy..", "......yyy...", ".....yyy....", "....yyy.....", "...yy......."]

const recordImg = (tier, scale, cls = "") => pxImg("rec-" + tier, recordRows(tier, 0), scale, cls);
function recordSpin(tier, scale) {      // 4-frame strip as a stepped background
  const frames = [0, 1, 2, 3].map(f => recordRows(tier, f)), strip = frames[0].map((_, y) => frames.map(fr => fr[y]).join(""));
  const s = pxURL("spin-" + tier, strip), size = 16 * scale;
  return `<span class="rec" style="--sz:${size}px;background-image:url(${s.url})" aria-hidden="true"></span>`;
}
const crateImg = (sleeves, scale = 4) => { const s = pxURL("crate-" + sleeves.join(","), crateRows(sleeves)); return `<img class="px" src="${s.url}" width="${s.w * scale}" height="${s.h * scale}" alt="">`; };
// Third digger frame: the record held up over the head.
DIGGER.push(["............vvv.", "............vyv.", ".....hhhhh..vvv.", "....hhhhhhh..s..", "...chssssshc.o..", "...cssesessc.o..", "....sssssss..o..", ".....sssss...o..",
  "....ooooooooo...", "...oooooooo.....", "...oooooooo.....", "...oooooooo.....", "...oooooooo.....", "....ddd.ddd.....", "....ddd.ddd.....", "....ww...ww....."]);
// Head-nod frames for the booth: frame 0 = head up, frame 1 = head down (on the beat).
const NOD_UP = DIGGER[1].map((row, y) => (y >= 2 && y <= 6 ? DIGGER[1][y + 1] : y === 7 ? ".....sssss......" : row));
const NOD = [NOD_UP, DIGGER[1]];
// A speaker cabinet: frame 1 is the cone pushed out (drawn on kick and 808 hits).
function speakerRows(push) {
  return grid(16, 20, (x, y) => {
    if (x === 0 || x === 15 || y === 0 || y === 19) return "k";
    const tw = Math.hypot(x - 7.5, y - 4); if (tw < 1.8) return tw < 0.9 ? "c" : "g";
    const d = Math.hypot(x - 7.5, y - 12.5), R = push ? 6.4 : 5.8;
    if (d < 1.4) return "o";
    if (d < (push ? 3.4 : 2.8)) return push ? "G" : "m";
    if (d < R - 0.9) return push ? "g" : "G";
    if (d < R) return push ? "c" : "g";
    return "m";
  });
}
// Lay frames side by side so CSS can step through them.
function strip(key, frames) { return pxURL(key, frames[0].map((_, y) => frames.map(f => f[y]).join(""))); }
function stripSprite(key, frames, scale, { cls = "", id = "", loop = 0 } = {}) {
  const s = strip(key, frames), w = frames[0][0].length * scale, h = frames[0].length * scale;
  return `<span ${id ? `id="${id}"` : ""} class="spr ${loop ? "loop" : ""} ${cls}" style="--w:${w}px;--h:${h}px;--n:${frames.length};--dur:${loop}ms;background-image:url(${s.url})" aria-hidden="true"></span>`;
}
function kitRows(hit) {        // drum kit: hi-hat (right), snare (left), kick (centre)
  return grid(26, 18, (x, y) => {
    const kd = Math.hypot(x - 13, y - 11.5);
    if (kd < 6.2) return kd > 5.2 ? "c" : kd < 2 ? (hit ? "y" : "O") : hit ? "w" : "o";
    if (y >= 9 && y <= 12 && x >= 1 && x <= 6) return y === 9 ? "c" : "m";
    if (x === 22 && y > (hit ? 3 : 4) && y < 17) return "G";
    if (y === (hit ? 3 : 4) && x >= 18 && x <= 25) return hit ? "y" : "Y";
    if (y === 17 && (x === 3 || x === 20 || x === 24 || x === 9 || x === 17)) return "G";
    return ".";
  });
}
function keysRows(lit) {       // keyboard: lit keys flash on melody notes
  return grid(28, 11, (x, y) => {
    if (y === 0 || y === 10 || x === 0 || x === 27) return "B";
    if (y < 2) return "B";
    const k = Math.floor((x - 1) / 3), blackCol = (x - 1) % 3 === 2 && [0, 1, 3, 4, 5, 7].includes(k);
    if (y < 7 && blackCol) return "v";

function meterRows(level) {    // FX meter: fills through the build-up, flashes on the drop
  return grid(10, 22, (x, y) => {

    const seg = Math.floor((20 - y) / 4);

const LANE_SPRITE = {
  drums: () => stripSprite("kit", [kitRows(false), kitRows(true)], 4, { id: "lsp" }),
  bass: () => stripSprite("spk", [speakerRows(false), speakerRows(true)], 4, { id: "lsp" }) + stripSprite("spk", [speakerRows(false), speakerRows(true)], 4, { id: "lsp2" }),
  mel: () => stripSprite("keys", [keysRows(false), keysRows(true)], 4, { id: "lsp" }),
  fx: () => stripSprite("meter", [0, 1, 2, 3, 4, 5].map(meterRows), 4, { id: "lsp" })

function scene() {
  const demo = ["bside", "white", "bside", "promo", "test", "bside", "white", "grail", "bside", "promo", "white", "test", "bside", "white"];
  return `<div class="scene" aria-hidden="true">${stripSprite("dig-loop", [DIGGER[1], DIGGER[0], DIGGER[2], DIGGER[0]], 6, { loop: 1800 })}<span class="crate-big">${crateImg(demo, 5)}</span></div>`;

  return `<div class="howpix ${small ? "sm" : ""}" role="img" aria-label="Weights: common spot 0.5, rare spot up to 7, Grail 12, a spot nobody uses 0">
    ${it("bside", "0.5", "common")}${it("test", "7", "rare")}${it("grail", "12", "grail")}${it("dead", "0", "nobody")}</div>`;
}
</script>

function dialSvg() {        // cream VU face; the needle element, its pivot and its length are unchanged

/* ---------- the weigh-in state machine: intro → per lane (surge?) → lane → notes → subtotal → final ---------- */
function setNeedle(w) { const el = document.getElementById("needle"); if (el) el.style.transform = `rotate(${-90 + 180 * Math.min(1, w / CONFIG.SCALE_MAX)}deg)`; }
let shown = 0;
function setReadout(w) {
  const el = document.getElementById("wt"); if (!el) return;
  const from = shown, t0 = performance.now(); shown = w;
  const step = now => { const k = Math.min(1, (now - t0) / 220); el.textContent = (from + (w - from) * k).toFixed(1); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function weighSteps(R) {
  const steps = [{ t: "intro" }];
  for (const L of LANES) {
    const lane = R.lanes.find(l => l.lane === L.id);
    if (L.mult > 1) steps.push({ t: "surge", L });
    steps.push({ t: "lane", L });
    lane.notes.forEach(n => steps.push({ t: "note", L, n }));
    steps.push({ t: "sub", L, lane });
  }
  steps.push({ t: "final" });
  return steps;
}
async function runWeighIn() {
  const id = ++S.reveal, R = S.result, D = CONFIG.REVEAL;
  let running = 0, banked = 0; shown = 0; S.weighLog = []; S.sleeves = [];
  audioInit();
  for (const st of weighSteps(R)) {
    if (id !== S.reveal) return;
    const fast = S.fast, now = ctx.currentTime + 0.01, wait = ms => sleep(fast ? 0 : ms);
    S.weighLog.push(st.t);
    if (st.t === "intro") await wait(400);
    else if (st.t === "surge") {
      if (!fast) SFX.riser(now, D.SURGE_MS / 1000);
      document.getElementById("x2").classList.add("flash");
      setNeedle(banked + CONFIG.SCALE_MAX * 0.15); await wait(D.SURGE_MS * 0.6);
      setNeedle(banked); await wait(D.SURGE_MS * 0.4);
    } else if (st.t === "lane") {
      document.getElementById(`row-${st.L.id}`).classList.add("live"); await wait(D.LANE_MS);
    } else if (st.t === "note") {
      const n = st.n, el = document.querySelector(`#st-${st.L.id} i[data-s="${n.step}"][data-r="${n.row}"]`);
      if (el) { el.className = `${n.tier} hit`; el.dataset.w = n.w ? "+" + (n.w % 1 ? n.w.toFixed(1) : n.w) : "0"; el.title = `${stampLabel(st.L, n)} · ${n.tierName} · ${fmtPct(n.share)} of players · ${n.w.toFixed(1)}`; }
      running += n.w; setNeedle(running); setReadout(running);
      S.sleeves.push(n.tier); const cr = document.getElementById("crate");
      if (cr) { cr.innerHTML = crateImg(S.sleeves); if (!fast) { const d = document.createElement("span"); d.className = "dropper"; d.innerHTML = recordImg(n.tier, 2); cr.appendChild(d); setTimeout(() => d.remove(), 300); } }
      if (!fast) SFX.thunk(now, Math.min(12, n.w));
      await wait(D.NOTE_MS);
    } else if (st.t === "sub") {
      const lane = st.lane, row = document.getElementById(`row-${st.L.id}`);
      banked += lane.total; running = banked;
      document.getElementById(`sub-${st.L.id}`).innerHTML = `${lane.total.toFixed(1)}${lane.problems.length ? "<small>invalid</small>" : lane.mud.length ? "<small>mud ×0.5</small>" : lane.mult > 1 ? "<small>doubled</small>" : ""}`;
      if (lane.problems.length) row.insertAdjacentHTML("beforeend", `<div class="wnote bad">Invalid: ${lane.problems.join("; ")} — lane scores 0.</div>`);
      else lane.mud.forEach(t => row.insertAdjacentHTML("beforeend", `<div class="wnote">${t} — lane capped at 50%.</div>`));
      row.classList.remove("live"); row.classList.add("done");
      setNeedle(running); setReadout(running);
      if (!fast) SFX.stamp(now);
      await wait(D.SUB_MS);
    } else if (st.t === "final") {
      setNeedle(R.total); setReadout(R.total);
      SFX.subdrop(now);
      document.getElementById("skip").style.display = "none";
      document.querySelectorAll(".final").forEach(f => f.classList.add("show"));
      await sleep(D.FINAL_MS);
    }
  }
  S.weighDone = true;
}

/* ---------- "heavier next time": the one swap that would have added the most weight ---------- */
function bestSwap(pz, beat, res) {
  let best = null;
  for (const L of LANES) {
    const lane = pz.L[L.id], cur = beat[L.id];
    cur.forEach((n, i) => {
      for (const t of lane.valid) {
        if (t === lane.grail) continue;
        const [, st, row] = t.split(":").map(Number);
        if (st === n.step && row === n.row) continue;
        if (cur.some((m, j) => j !== i && m.step === st && (L.mono || m.row === row))) continue;
        const nb = Object.assign({}, beat, { [L.id]: cur.map((m, j) => (j === i ? { step: st, row } : m)) });
        const r = scoreRun(pz, nb), gain = r1(r.total - res.total);
        if (gain > 0 && (!best || gain > best.gain)) {
          const fromN = res.lanes.find(l => l.lane === L.id).notes.find(x => x.step === n.step && x.row === n.row);
          const toN = r.lanes.find(l => l.lane === L.id).notes.find(x => x.step === st && x.row === row);
          best = { lane: L.id, from: n, to: { step: st, row }, gain, beat: nb, fromTier: fromN.tierName, fromW: fromN.w, toTier: toN.tierName, toW: toN.w };
        }
      }
    });
  }
  return best;
}
function vSwapGrid(w) {
  const L = laneOf(w.lane), lane = S.result.lanes.find(l => l.lane === w.lane), g = lane.grail.token.split(":").map(Number);
  const rows = rowsOf(L).map(r => `<span class="sl">${r.label}</span>` + Array.from({ length: 16 }, (_, st) => {
    const n = lane.notes.find(x => x.step === st && x.row === r.row);
    const from = st === w.from.step && r.row === w.from.row, to = st === w.to.step && r.row === w.to.row, grail = !lane.grail.found && st === g[1] && r.row === g[2];
    return `<i class="${n ? n.tier : ""} ${from ? "from" : ""} ${to ? "to" : ""} ${grail ? "gr" : ""}"></i>`;
  }).join("")).join("");
  return `<div class="swapgrid" role="img" aria-label="Your ${L.name} notes coloured by weight; move the outlined note to the flashing cell">${rows}</div>
    <p class="swapkey"><span class="k-from"></span>move this <span class="k-to"></span>to here${lane.grail.found ? "" : ` <span class="k-gr"></span>Grail`}</p>`;
}
function vLadder(total) {     // the crate tiers as a bar: where you landed, and what the next tier needs
  const T = CONFIG.CRATE_TIERS, max = CONFIG.SCALE_MAX, next = T.find(([m]) => m > total);
  const segs = T.map(([min, name], i) => { const end = i < T.length - 1 ? T[i + 1][0] : max; return `<i class="${tierIdOfName(name)}" style="width:${((end - min) / max * 100).toFixed(2)}%"></i>`; }).join("");
  return `<div class="ladder"><div class="lbar">${segs}<span class="you" style="left:${(Math.min(total, max) / max * 100).toFixed(2)}%"></span></div>
    <p class="lnext">${next ? `Next tier: <b>${next[1]}</b> at ${next[0]} — <b>${(next[0] - total).toFixed(1)}</b> to go.` : "Top tier. Nothing heavier exists today."}</p></div>`;
}
function vBreakdown(R) {     // every note, grouped by how rare its spot was
  const order = ["grail", "test", "promo", "white", "bside", "dead"], g = {};
  for (const l of R.lanes) for (const n of l.notes) { (g[n.tier] ||= { n: 0, w: 0 }).n++; g[n.tier].w += n.w * (l.problems.length ? 0 : l.mud.length ? CONFIG.MUD_CAP : 1); }
  const all = Object.values(g).reduce((a, b) => a + b.n, 0) || 1, total = R.total || 1;
  const name = id => (id === "grail" ? CONFIG.GRAIL : id === "dead" ? CONFIG.DEAD : CONFIG.LADDER.find(x => x.id === id)).name;
  const dead = (g.dead || {}).n || 0, light = ((g.bside || {}).n || 0) + ((g.white || {}).n || 0), rare = ((g.test || {}).n || 0) + ((g.grail || {}).n || 0) + ((g.promo || {}).n || 0);
  const verdict = dead && dead >= rare ? `${dead} of your notes landed where nobody plays, so ${dead > 1 ? "they weigh" : "it weighs"} nothing. Move ${dead > 1 ? "them" : "it"} somewhere a few players use.`
    : light > rare ? "Most of your notes sit where most players put theirs — that's why they're light. Rare spots weigh up to 14× more."
    : "Most of your weight came from rare spots. A Grail is the only way to go heavier.";
  return `<div class="bd"><p class="sechead">Where your weight came from<small>${verdict}</small></p>
    ${order.filter(t => g[t]).map(t => `<div class="bdrow ${t}">${recordImg(t, 2)}<span class="bn">${g[t].n} × ${name(t)}</span><span class="bbar"><i style="width:${Math.max(2, g[t].w / total * 100).toFixed(1)}%"></i></span><span class="bw">${g[t].w.toFixed(1)}</span></div>`).join("")}</div>`;
}

  return `<div class="tip"><p><span class="lbl">Heavier next time</span><br>Your ${L.name.replace(/^The /, "")} ${nm(w.from)} was a <b>${w.fromTier}</b> (${w.fromW.toFixed(1)}). ${nm(w.to)} is a <b>${w.toTier}</b> — that one swap adds <b class="gain">+${w.gain.toFixed(1)}</b>.</p>
    ${vSwapGrid(w)}<button class="btn" data-act="swap">▶ Hear the swap</button>${rule}</div>`;

/* The crowd map: every cell anyone used, brighter = more players; Grails outlined. Shown after you play, and for past days. */
function vCrowdLanes(pz) {
  return LANES.map(L => {
    const lane = pz.L[L.id], rows = rowsOf(L), max = Math.max(...[...lane.valid].map(t => shareOf(pz, L.id, t)));
    const mine = S.result && S.result.puzzle_id === pz.id ? new Set(S.result.lanes.find(l => l.lane === L.id).notes.map(n => n.token)) : new Set();
    const cells = rows.map(r => `<span class="sl">${r.label}</span>` + Array.from({ length: 16 }, (_, st) => {
      const t = tok(L.id, st, r.row), sh = lane.valid.has(t) ? shareOf(pz, L.id, t) : 0, tier = sh ? tierOf(pz, L.id, t, sh).id : "";
      return `<i class="${tier} ${mine.has(t) ? "mine" : ""} ${t === lane.grail ? "gr" : ""}" style="${sh ? `--a:${(0.25 + 0.75 * sh / max).toFixed(2)}` : ""}" title="${r.label} step ${st + 1}: ${sh ? fmtPct(sh) + " of players" : "nobody"}"></i>`;
    }).join("")).join("");
    return `<div class="cmlane"><p class="cmname">${pxImg("lane-" + L.id, LANE_ICON[L.id](), 2, "")}${L.name.replace(/^The /, "")}</p><div class="cmgrid">${cells}</div></div>`;
  }).join("");
}
function vCrowdMap() {
  const played = S.result && S.result.puzzle_id === S.pz.id;
  return `<p class="sechead">Where everyone went<small>${S.pz.name} · No. ${pad3(S.day)}. Brighter squares = more players chose that spot. Dark squares nobody used (dead wax). ${played ? "Your notes are outlined." : ""} The gold-ringed squares are the Grails.</small></p>
  ${howStrip(true)}${vCrowdLanes(S.pz)}
  <div class="links"><a href="#" data-act="back">← Back</a></div>`;
}

/* ---------- render ---------- */
function render() {
  const v = { start: vStart, archive: vArchive, round: vRound, reveal: vReveal, crowdmap: vCrowdMap }[S.screen]();
  app.innerHTML = vTop() + `<main class="screen">${v}</main>`;
  syncPlay(); window.scrollTo(0, 0);
}
narrow.addEventListener("change", () => { if (S.screen === "round") refreshRound(); });

/* ---------- flow ---------- */
function startRun() {
  audioInit(); stop();
  const scored = S.day === TODAY && !store.get(cardKey(TODAY));
  Object.assign(S, { practice: !scored, round: 1, beat: emptyBeat(), result: null, glide: false, fast: false, weighDone: false,
    session: { puzzle_id: S.pz.id, puzzle_no: S.day, practice: !scored, session_id: Math.random().toString(36).slice(2, 10), started_ts: new Date().toISOString(), choices: [] } });
  S.screen = "round"; render(); startTimer(); play();
}
function startTimer() {
  clearInterval(S.timer); S.deadline = Date.now() + CONFIG.ROUND_SECONDS * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000)), el = document.getElementById("timer");
    if (el) { el.textContent = `${Math.floor(left / 60)}:${pad2(left % 60)}`; el.classList.toggle("low", left <= 10); }
    if (left <= 0) lock();
  };
  tick(); S.timer = setInterval(tick, 200);
}
function lock() {     // also called when the timer runs out; unmet visible rules then zero the lane at scoring
  clearInterval(S.timer);
  const L = curLane();
  for (const n of sortNotes(S.beat[L.id])) S.session.choices.push(Object.assign({ round: L.round, lane: L.id, kind: L.kind, token: tok(L.id, n.step, n.row) }, n.glide ? { glide: true } : {}, n.roll > 1 ? { roll: n.roll } : {}));
  if (S.round < 4) { S.round++; S.glide = false; closeRoll(); render(); startTimer(); return; }
  finish();
}
function finish() {
  stop();
  S.result = scoreRun(S.pz, S.beat);
  S.heavier = heavierThan(S.pz, S.result.total);
  S.swap = bestSwap(S.pz, S.beat, S.result);
  S.streak = 0;
  if (!S.practice) {
    addToPool(S.pz, S.beat, S.result.total);
    S.streak = bumpStreak();
    store.set(cardKey(TODAY), { result: S.result, beat: S.beat, log: S.session, heavier: S.heavier });
  }
  S.screen = "reveal"; render(); runWeighIn();
}
function toggleCell(s, r, el) {
  const L = curLane(), notes = S.beat[L.id];
  const at = notes.findIndex(n => n.step === s && n.row === r);
  if (at >= 0) { notes.splice(at, 1); refreshRound(); return; }
  let placed = null;
  if (L.mono && L.id !== "mel") { const col = notes.find(n => n.step === s); if (col) { col.row = r; placed = col; } }
  if (!placed) {
    if (notes.length >= L.budget) return;
    placed = Object.assign({ step: s, row: r }, L.id === "bass" && S.glide ? { glide: true } : {}); notes.push(placed);
  }
  if (!blindNow() && prefs.tap) { audioInit(); playNote(S.pz, L.id, placed, ctx.currentTime + 0.005, false); }
  S.just = `${placed.step}:${placed.row}`; refreshRound(); S.just = null;
}
function closeRoll() { const p = document.getElementById("rollpick"); if (p) p.remove(); }
function openRoll(s, anchor) {
  closeRoll();
  const n = S.beat.drums.find(x => x.step === s && x.row === 2); if (!n) return;
  const cell = anchor || document.querySelector(`.c[data-s="${s}"][data-r="2"]`), r = cell.getBoundingClientRect();
  const p = document.createElement("div"); p.id = "rollpick"; p.setAttribute("role", "group"); p.setAttribute("aria-label", `Roll for the hat on step ${s + 1}`);
  p.innerHTML = `<span class="lbl">Roll</span>` + [1, 2, 3, 4].map(k => `<button data-act="setRoll" data-s="${s}" data-n="${k}" class="${(n.roll || 1) === k ? "on" : ""}" aria-label="${k === 1 ? "Single hit" : `Roll ×${k}`}">${k === 1 ? "1" : "×" + k}</button>`).join("") +
    `<button data-act="setRoll" data-s="${s}" data-n="0" aria-label="Remove hat">✕</button>`;
  app.appendChild(p);
  const w = p.offsetWidth, h = p.offsetHeight, below = r.bottom + 10 + h < innerHeight;
  p.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  p.style.top = (below ? r.bottom + 10 : r.top - h - 10) + "px";
  (p.querySelector("button.on") || p.querySelector("button")).focus();
}
async function copyText(text, msg) {
  const say = t => { const m = document.getElementById("copymsg"); if (m) m.textContent = t; };
  try { await navigator.clipboard.writeText(text); say(msg); return; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove();
  say(ok ? msg : "Copy blocked here — screenshot the card instead.");
}
function listen(id, beat) { stop(); play(() => ({ pz: S.pz, beat, arr: "once" })); S.listen = id; syncPlay(); }
/* Start transition: pixels sweep in until the screen is fully covered, the round swaps in underneath while
   nothing is visible, then the pixels sweep out. Two clean phases, so you never see both screens at once. */
/* iPhones mute web audio when the silent switch is on, with no warning. Tell iOS players once per visit. */
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function soundHint() {
  if (!IS_IOS || soundHint.shown) return; soundHint.shown = true;
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<b>No sound?</b> Flip your phone's silent switch off.`;
  document.body.appendChild(t); setTimeout(() => t.classList.add("bye"), 4200); setTimeout(() => t.remove(), 4700);
}
function pixelGo(then) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || document.getElementById("pxgo")) return then();
  audioInit();                                   // unlock audio inside the tap
  const size = 44, cols = Math.ceil(innerWidth / size), rows = Math.ceil(innerHeight / size), step = 4, dur = 170, el = document.createElement("div");
  el.id = "pxgo"; el.setAttribute("aria-hidden", "true");
  el.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`; el.style.setProperty("--dur", dur + "ms");
  let html = "";
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) html += `<i class="${(x + y) % 4 === 0 ? "b" : ""}" style="--d:${(x + y) * step}ms"></i>`;
  el.innerHTML = html + `<span>Round 01 · Drums</span>`;
  document.body.appendChild(el);
  const covered = (cols + rows) * step + dur;
  setTimeout(() => {
    el.classList.add("full");                    // solid layer: no seams while the screens swap
    then();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      setTimeout(() => { el.classList.remove("full"); el.classList.add("out"); setTimeout(() => el.remove(), covered + 40); }, 40);
    }));
  }, covered);
}
const ACT = {
  start: () => { soundHint(); pixelGo(startRun); },
  view() {
    const c = store.get(cardKey(TODAY));
    Object.assign(S, { result: c.result, beat: c.beat, session: c.log, heavier: c.heavier, practice: false, fast: true, streak: streakNow() });
    S.swap = bestSwap(S.pz, S.beat, S.result);
    S.screen = "reveal"; render(); runWeighIn();
  },
  archive(el, e) { e.preventDefault(); stop(); S.screen = "archive"; render(); },
  today(el, e) { e.preventDefault(); stop(); S.day = TODAY; S.pz = puzzleForDay(TODAY); S.practice = false; S.screen = "start"; render(); },
  pickDay(el) { S.day = +el.dataset.day; S.pz = puzzleForDay(S.day); S.practice = true; S.screen = "start"; render(); },
  toggle() { Engine.running ? stop() : play(); },
  cell(el) { if (!el.classList.contains("spent")) toggleCell(+el.dataset.s, +el.dataset.r, el); },
  clear() { S.beat[curLane().id] = []; refreshRound(); },
  tapsnd(el) { prefs.tap = !prefs.tap; store.set(PREFS_KEY, prefs); el.classList.toggle("on", prefs.tap); el.setAttribute("aria-pressed", prefs.tap); },
  crowd() { prefs.crowd = !prefs.crowd; store.set(PREFS_KEY, prefs); render(); },
  crowdmap() { stop(); S.screen = "crowdmap"; render(); },
  back() { stop(); S.screen = S.result && S.result.puzzle_id === S.pz.id ? "reveal" : "start"; render(); if (S.screen === "reveal") { S.fast = true; runWeighIn(); } },
  solo(el) { S.solo = !S.solo; el.classList.toggle("on", S.solo); el.setAttribute("aria-pressed", S.solo); },
  setRoll(el) {
    const s = +el.dataset.s, k = +el.dataset.n, notes = S.beat.drums, i = notes.findIndex(x => x.step === s && x.row === 2);
    closeRoll(); if (i < 0) return;
    if (!k) notes.splice(i, 1);
    else { if (k > 1) notes[i].roll = k; else delete notes[i].roll; if (prefs.tap) { audioInit(); playNote(S.pz, "drums", notes[i], ctx.currentTime + 0.005); } S.just = `${s}:2`; }
    refreshRound();
  },
  glide(el) { S.glide = !S.glide; el.classList.toggle("on", S.glide); el.textContent = `Glide ${S.glide ? "on" : "off"}`; },
  lock: () => lock(),
  skip() { S.fast = true; },
  playBeat() { if (Engine.running && S.listen === "beat") return stop(); listen("beat", S.beat); },
  swap() { if (Engine.running && S.listen === "swap") return stop(); listen("swap", S.swap.beat); },
  grail(el) {
    const id = el.dataset.lane;
    if (Engine.running && S.listen === id) return stop();
    const L = laneOf(id), [, s, r] = S.result.lanes.find(l => l.lane === id).grail.token.split(":").map(Number);
    const beat = JSON.parse(JSON.stringify(S.beat));
    if (L.mono) beat[id] = beat[id].filter(n => n.step !== s);
    beat[id].push({ step: s, row: r });
    S.grailBeat = beat; listen(id, beat);
  },
  copyShare() { copyText(shareText(S.day, S.result, S.practice ? 0 : S.streak, S.pz.name), "Copied — paste it anywhere."); },
  copyLog() { copyText(JSON.stringify(S.session, null, 2), "Log copied."); },
  home() { stop(); S.reveal++; S.screen = "start"; render(); }
};
/* Hat rolls: right-click a hat (long-press on touch) to open the roll picker; places the hat first if it's empty. */
function rollMenu(cell) {
  if (S.screen !== "round" || curLane().id !== "drums" || !cell || +cell.dataset.r !== 2) return false;
  const st = +cell.dataset.s, notes = S.beat.drums;
  if (!notes.some(n => n.step === st && n.row === 2)) { if (notes.length >= LANES[0].budget) return true; toggleCell(st, 2); }
  openRoll(st);
  return true;
}
app.addEventListener("contextmenu", e => { const c = e.target.closest(".c"); if (c && rollMenu(c)) e.preventDefault(); });
let pressTimer = null, pressFired = false;
app.addEventListener("pointerdown", e => {
  const c = e.target.closest(".c"); pressFired = false;
  if (!c || e.pointerType === "mouse") return;
  pressTimer = setTimeout(() => { if (rollMenu(c)) { pressFired = true; if (navigator.vibrate) try { navigator.vibrate(12); } catch (x) {} } }, 450);
});
["pointerup", "pointercancel", "pointermove"].forEach(t => app.addEventListener(t, e => { if (t !== "pointermove" || Math.abs(e.movementX) + Math.abs(e.movementY) > 6) clearTimeout(pressTimer); }));
app.addEventListener("click", e => {
  if (pressFired) { pressFired = false; e.preventDefault(); return; }   // the long-press already opened the picker
  if (!e.target.closest("#rollpick")) closeRoll();
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
render();

/* ---------- intro: a record slides out of its sleeve, the logo stamps in, tap to drop the needle ---------- */
function sleeveRows() {
  return grid(18, 18, (x, y) => {
    if (x === 0 || y === 0 || x === 17 || y === 17) return "O";
    if (Math.hypot(x - 8.5, y - 8.5) < 2.6) return "n";
    if (y === 13 || y === 14) return "c";
    return "o";
  });
}
function intro() {
  const el = document.createElement("div");
  el.id = "intro"; el.setAttribute("role", "button"); el.setAttribute("tabindex", "0"); el.setAttribute("aria-label", "Beat Rarity. Tap to enter.");
  el.innerHTML = `<div class="in-stage" aria-hidden="true"><span class="in-rec">${stripSprite("intro-rec", [0, 1, 2, 3].map(f => recordRows("test", f)), 8, { loop: 320 })}</span>
      <span class="in-sleeve">${pxImg("sleeve", sleeveRows(), 8)}</span></div>
    <div class="in-logo" aria-hidden="true">${[..."BEAT"].map((c, i) => `<span style="--i:${i}">${c}</span>`).join("")}<b>${[..."RARITY"].map((c, i) => `<span style="--i:${i + 4}">${c}</span>`).join("")}</b></div>
    <div class="in-meta">No. ${pad3(S.day)} · ${S.pz.name} · ${S.pz.bpm} BPM</div>
    <span class="in-go">Tap to enter</span>`;
  document.body.appendChild(el);
  let gone = false;
  const enter = () => {
    if (gone) return; gone = true;
    try {                                   // needle drop: crackle, then the day's kick and a sub drop
      audioInit(); const t = ctx.currentTime + 0.02;
      nz(t, "lowpass", 2600, 0.7, 0.3, 0.1, master);
      for (let i = 0; i < 6; i++) nz(t + Math.random() * 0.25, "highpass", 3000, 0.7, 0.004, 0.25, master);
      K.kick(t + 0.28, S.pz.kit); SFX.subdrop(t + 0.28);
    } catch (e) {}
    el.classList.add("out");
    setTimeout(() => el.remove(), 420);
    document.removeEventListener("keydown", key);
  };
  const key = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); } };
  el.addEventListener("click", enter); document.addEventListener("keydown", key);
}
intro();
</script>
